        UC22, RG09, RG33, RG39. Une pesée saisie est supprimée. Une pesée importée de Santé n'est pas effacée de
        Santé : elle est marquée ignorée (`is_ignored`), son poids est effacé (minimisation), elle n'est plus renvoyée et ne
        revient pas au prochain import. Dans les deux cas, le poids du profil redevient celui de la pesée
        précédente ; en mode `computed`, l'objectif est recalculé et versionné (RG34, RG52).
