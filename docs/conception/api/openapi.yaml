  /backoffice/admin-actions:
    get:
      tags: [Back-office journal]
      operationId: indexAdminActions
      summary: Lire le journal des actions d'administration
      description: |
        UC32, UC33, UC34, UC35, RG48. Du plus récent au plus ancien, paginé. Chaque ligne donne la date, l'administrateur, l'action,
        le type et l'identifiant de la cible, sans nom ni email de la cible.
      x-role: admin
      parameters:
        - name: action
          in: query
          schema: { $ref: '#/components/schemas/AdminActionKind' }
        - name: targetKind
          in: query
          schema: { $ref: '#/components/schemas/AdminTargetKind' }
        - name: adminID
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Per'
      responses:
        '200':
          description: Page du journal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminActionPage' }
              example:
                items:
                  - id: c9d0e1f2-a3b4-4c5d-8e6f-7a8b9c0d1e2f
                    action: block
                    targetKind: user
                    targetID: 4a5b6c7d-8e9f-4a0b-9c1d-2e3f4a5b6c7d
                    performedAt: '2026-11-26T15:02:00Z'
                    adminID: 5b6c7d8e-9f0a-4b1c-8d2e-3f4a5b6c7d8e
                    adminFirstName: Admin
                    adminLastName: ZakFit
                metadata: { page: 1, per: 10, total: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Jeton renvoyé par `POST /auth/login`, à envoyer dans `Authorization: Bearer <jeton>`.
        Il ne contient que l'identifiant (`sub`) et l'expiration (`exp`, 7 jours). Le statut et le rôle sont relus
        en base à chaque requête (RG05, RG06, RG44).

  parameters:
    Page:
      name: page
      in: query
      description: Numéro de page, à partir de 1.
      schema: { type: integer, minimum: 1, default: 1 }
    Per:
      name: per
      in: query
      description: Éléments par page.
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Order:
      name: order
      in: query
      description: Sens du tri.
      schema: { type: string, enum: [asc, desc], default: desc }
    Lang:
      name: lang
      in: query
      description: Langue des noms pour les tris alphabétiques et l'export (RG49).
      schema: { type: string, enum: [fr, en], default: fr }
    Date:
      name: date
      in: query
      description: Jour local, aujourd'hui par défaut dans le fuseau du profil. Exclusif de `from` et `to`.
      schema: { $ref: '#/components/schemas/LocalDate' }
    From:
      name: from
      in: query
      description: Premier jour local de la plage, inclus.
      schema: { $ref: '#/components/schemas/LocalDate' }
    To:
      name: to
      in: query
      description: Dernier jour local de la plage, inclus, jamais avant `from`.
      schema: { $ref: '#/components/schemas/LocalDate' }
    FromRequired:
      name: from
      in: query
      required: true
      description: Premier jour de la plage, inclus.
      schema: { $ref: '#/components/schemas/LocalDate' }
    ToRequired:
      name: to
      in: query
      required: true
      description: Dernier jour de la plage, inclus, jamais avant `from` (366 jours au plus).
      schema: { $ref: '#/components/schemas/LocalDate' }
    DayPath:
      name: date
      in: path
      required: true
      description: Jour local AAAA-MM-JJ.
      schema: { $ref: '#/components/schemas/LocalDate' }
    FoodID:
      name: foodID
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    FoodPortionID:
      name: foodPortionID
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    MealID:
      name: mealID
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    FavoriteMealID:
      name: favoriteMealID
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ActivityID:
      name: activityID
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    WeighInID:
      name: weighInID
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ActivityGoalID:
      name: activityGoalID
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    UserID:
      name: userID
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ActivityTypeID:
      name: activityTypeID
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ReminderKindPath:
      name: kind
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ReminderKind' }

  responses:
    BadRequest:
      description: |
        Requête invalide (400) : corps ou paramètre mal formé, identifiant qui n'est pas un UUID,
        valeur hors bornes, règle de validation non respectée. Le message dit quel champ corriger.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: true, reason: La quantité d'une ligne doit être comprise entre 1 et 5 000 g. }
    Unauthorized:
      description: Jeton absent, invalide ou expiré (401, RG05). L'app renvoie vers l'écran de connexion.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: true, reason: Session expirée. Reconnecte-toi. }
    Forbidden:
      description: Compte bloqué ou suspendu (RG06), ou rôle insuffisant pour le back-office (RG44) (403).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            bloque:
              value: { error: true, reason: Ton compte est bloqué jusqu'au 15/12/2026. }
            suspendu:
              value: { error: true, reason: Ton compte est suspendu. }
            role:
              value: { error: true, reason: Accès réservé aux administrateurs. }
    NotFound:
      description: |
        Ressource absente (404), ou qui appartient à un autre utilisateur, pour ne pas révéler qu'elle existe (RG09).
        Vaut aussi pour un identifiant du corps qui ne désigne rien (aliment, unité, type, catégorie, allergène).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: true, reason: Repas introuvable. }
    Conflict:
      description: |
        Conflit d'état ou d'unicité (409) : email ou nom de favori déjà pris, consentement absent ou déjà actif,
        objectif déjà en cours, élément archivé, unité utilisée, action interdite sur son propre compte.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { error: true, reason: Cette action demande un consentement santé actif. }

  schemas:

    # ------------------------------------------------------------ Types de base

    Uuid:
      type: string
      format: uuid
      example: 3f2b8c1e-7a4d-4e9b-9c21-5d6e8f0a1b2c
    LocalDate:
      type: string
      format: date
      description: Jour local AAAA-MM-JJ, dans le fuseau du profil.
      example: '2026-11-27'
    Instant:
      type: string
      format: date-time
      description: Instant ISO 8601 en UTC.
      example: '2026-11-27T11:30:00Z'
    ErrorResponse:
      type: object
      description: Format d'erreur de Vapor (`AbortError`).
      required: [error, reason]
      properties:
        error: { type: boolean, const: true }
        reason: { type: string, description: "Message en français." }
    PageMetadata:
      type: object
      required: [page, per, total]
      properties:
        page: { type: integer, minimum: 1 }
        per: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0, description: "Nombre total d'éléments." }
    DeletionOutcome:
      type: object
      description: Résultat d'une suppression qui devient un archivage si l'élément est déjà utilisé (RG22, RG46).
      required: [id, outcome]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        outcome: { type: string, enum: [deleted, archived] }

    # ------------------------------------------------------------ Listes de valeurs (ENUM du schéma SQL)

    Role: { type: string, enum: [user, admin], description: "RG07." }
    UserStatus: { type: string, enum: [active, blocked, suspended], description: "RG06." }
    Sex: { type: string, enum: [female, male], description: "RG13, sert seulement à Mifflin-St Jeor." }
    ActivityLevel: { type: string, enum: [low, moderate, active, very_active], description: "RG14, PAL 1.4 / 1.6 / 1.8 / 2.0." }
    GoalOrientation: { type: string, enum: [lose, maintain, gain], description: "RG15." }
    MeatPreference: { type: string, enum: [standard, halal, kosher, no_pork], description: "RG16." }
    MealType: { type: string, enum: [breakfast, lunch, dinner, snack], description: "RG23." }
    MealOrigin: { type: string, enum: [manual, favorite, photo], description: "RG28." }
    KcalStatus: { type: string, enum: [entered, estimated, unknown], description: "RG31." }
    DataSource: { type: string, enum: [manual, health], description: "RG33, RG39." }
    CalorieGoalMode: { type: string, enum: [computed, manual], description: "RG34, RG35." }
    GoalMetric: { type: string, enum: [sessions, minutes, kcal], description: "RG37." }
    GoalPeriod: { type: string, enum: [day, week, session], description: "RG37, session seulement pour kcal." }
    ReminderKind: { type: string, enum: [workout_reminder, weigh_in_reminder, motivation, evening_encouragement], description: "RG42." }
    Difficulty: { type: string, enum: [easy, moderate, hard], description: "RG29." }
    AdminActionKind: { type: string, enum: [block, suspend, reactivate, delete_user, create, update, archive, delete], description: "RG48." }
    AdminTargetKind: { type: string, enum: [user, food, activity_type], description: "RG48." }
    Macro: { type: string, enum: [protein, carbs, fat] }
    ActivitySort: { type: string, enum: [date_desc, date_asc, type, duration], default: date_desc, description: "RG32." }

    # ------------------------------------------------------------ Authentification et profil

    RegisterRequest:
      type: object
      required: [lastName, firstName, email, password, passwordConfirmation, adultDeclared]
      properties:
        lastName: { type: string, minLength: 1, maxLength: 50 }
        firstName: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, format: email, maxLength: 254, description: "Enregistré en minuscules (RG01)." }
        password:
          type: string
          minLength: 8
          description: 8 caractères au moins, une lettre et un chiffre, 72 octets UTF-8 au plus (RG02).
        passwordConfirmation: { type: string, description: "Identique à `password`." }
        adultDeclared: { type: boolean, const: true, description: "Case « J'ai 18 ans ou plus » (RG12)." }
        timeZone: { type: string, maxLength: 64, default: Europe/Paris, description: "Nom IANA (RG23)." }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1 }
        timeZone: { type: string, maxLength: 64, description: "Fuseau de l'appareil, met à jour le profil (RG23)." }
    LoginResponse:
      type: object
      required: [token, expiresAt, user]
      properties:
        token: { type: string, description: "JWT signé (RG05)." }
        expiresAt: { $ref: '#/components/schemas/Instant' }
        user: { $ref: '#/components/schemas/ProfileResponse' }
    ProfileResponse:
      type: object
      description: Compte de l'utilisateur, sans `password_hash` (RG03).
      required: [id, lastName, firstName, email, role, status, timeZone, adultDeclaredAt, healthConsentActive, calorieGoalDefined, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        lastName: { type: string }
        firstName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        timeZone: { type: string }
        adultDeclaredAt: { $ref: '#/components/schemas/Instant' }
        healthConsentActive: { type: boolean, description: "Un consentement santé non retiré existe (RG10)." }
        calorieGoalDefined: { type: boolean, description: "Un objectif calorique existe (fin du questionnaire, UC03)." }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        lastName: { type: string, minLength: 1, maxLength: 50 }
        firstName: { type: string, minLength: 1, maxLength: 50 }
        email: { type: string, format: email, maxLength: 254 }
    PasswordConfirmationRequest:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1 }
    UpdatePasswordRequest:
      type: object
      required: [currentPassword, newPassword, newPasswordConfirmation]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8, description: "RG02." }
        newPasswordConfirmation: { type: string }
    UpdateTimeZoneRequest:
      type: object
      required: [timeZone]
      properties:
        timeZone: { type: string, maxLength: 64, description: "Nom IANA connu." }

    # ------------------------------------------------------------ Consentement et profil de santé

    GrantHealthConsentRequest:
      type: object
      required: [textVersion, accepted]
      properties:
        textVersion: { type: string, maxLength: 20, description: "Version du texte affiché (RG10)." }
        accepted: { type: boolean, const: true }
    HealthConsentResponse:
      type: object
      required: [id, textVersion, grantedAt, withdrawnAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        textVersion: { type: string }
        grantedAt: { $ref: '#/components/schemas/Instant' }
        withdrawnAt:
          oneOf:
            - { $ref: '#/components/schemas/Instant' }
            - { type: 'null' }
    WithdrawHealthConsentResponse:
      type: object
      required: [consent, erased, calorieGoalMode, manualKcal]
      properties:
        consent: { $ref: '#/components/schemas/HealthConsentResponse' }
        erased:
          type: object
          description: Décompte de ce que le retrait a effacé (RG11).
          required: [healthProfile, weighIns, importedActivities, activeEnergyDays, estimatedKcalCleared, computedTargetVersions]
          properties:
            healthProfile: { type: boolean }
            weighIns: { type: integer, minimum: 0 }
            importedActivities: { type: integer, minimum: 0 }
            activeEnergyDays: { type: integer, minimum: 0 }
            estimatedKcalCleared: { type: integer, minimum: 0, description: "Séances saisies dont les kcal estimées passent à unknown." }
            computedTargetVersions: { type: integer, minimum: 0 }
        calorieGoalMode:
          description: Mode après le retrait, `null` s'il n'y avait pas d'objectif.
          oneOf:
            - { $ref: '#/components/schemas/CalorieGoalMode' }
            - { type: 'null' }
        manualKcal: { type: [integer, 'null'], minimum: 1200, maximum: 6000 }
    HealthProfileResponse:
      type: object
      required: [id, birthYear, sex, heightCm, activityLevel, goalOrientation, meatPreference, isVegetarian, isVegan, allergens, currentWeightKg, currentWeightOn, isComplete, ageOutsideFormulaRange, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        birthYear: { type: [integer, 'null'], minimum: 1900 }
        sex:
          oneOf:
            - { $ref: '#/components/schemas/Sex' }
            - { type: 'null' }
        heightCm: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        activityLevel:
          oneOf:
            - { $ref: '#/components/schemas/ActivityLevel' }
            - { type: 'null' }
        goalOrientation:
          oneOf:
            - { $ref: '#/components/schemas/GoalOrientation' }
            - { type: 'null' }
        meatPreference:
          oneOf:
            - { $ref: '#/components/schemas/MeatPreference' }
            - { type: 'null' }
        isVegetarian: { type: boolean }
        isVegan: { type: boolean }
        allergens:
          type: array
          items: { $ref: '#/components/schemas/Allergen' }
        currentWeightKg: { type: [number, 'null'], description: "Poids de la dernière pesée (RG39), non stocké à part." }
        currentWeightOn:
          description: Jour de la dernière pesée.
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        isComplete: { type: boolean, description: "Année, sexe, taille, niveau, orientation et une pesée sont connus (RG34)." }
        ageOutsideFormulaRange: { type: boolean, description: "Âge hors de 19 à 78 ans (Mifflin-St Jeor), l'app le signale (RG12)." }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    UpdateHealthProfileRequest:
      type: object
      minProperties: 1
      description: Champs absents inchangés, `null` efface. Contrôles RG12 à RG17 sur l'état final.
      properties:
        birthYear: { type: [integer, 'null'], minimum: 1900, description: "Donne 18 ans ou plus cette année (RG12)." }
        sex:
          oneOf:
            - { $ref: '#/components/schemas/Sex' }
            - { type: 'null' }
        heightCm: { type: [integer, 'null'], minimum: 100, maximum: 250 }
        activityLevel:
          oneOf:
            - { $ref: '#/components/schemas/ActivityLevel' }
            - { type: 'null' }
        goalOrientation:
          oneOf:
            - { $ref: '#/components/schemas/GoalOrientation' }
            - { type: 'null' }
        meatPreference:
          oneOf:
            - { $ref: '#/components/schemas/MeatPreference' }
            - { type: 'null' }
        isVegetarian: { type: boolean }
        isVegan: { type: boolean }
        allergenIDs:
          type: array
          uniqueItems: true
          maxItems: 14
          description: Remplace la liste des allergènes déclarés (RG17).
          items: { $ref: '#/components/schemas/Uuid' }

    # ------------------------------------------------------------ Référentiels

    Allergen:
      type: object
      required: [id, code, nameFr, nameEn]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 30, example: lait }
        nameFr: { type: string }
        nameEn: { type: string }
    FoodGroup:
      type: object
      required: [id, ciqualGroupCode, nameFr, nameEn]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        ciqualGroupCode: { type: string, minLength: 2, maxLength: 2, example: '04' }
        nameFr: { type: string }
        nameEn: { type: string }
    MuscleGroup:
      type: object
      required: [id, code, nameFr, nameEn]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 30, example: legs }
        nameFr: { type: string }
        nameEn: { type: string }
    ActivityCategory:
      type: object
      required: [id, code, nameFr, nameEn]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, maxLength: 30, example: cardio }
        nameFr: { type: string }
        nameEn: { type: string }
    ActivityCategoryWithTypes:
      allOf:
        - { $ref: '#/components/schemas/ActivityCategory' }
        - type: object
          required: [activityTypes]
          properties:
            activityTypes:
              type: array
              items: { $ref: '#/components/schemas/ActivityTypeSummary' }
    ActivityTypeSummary:
      type: object
      required: [id, compendiumCode, nameFr, nameEn, met, difficulty, instructionsFr, instructionsEn, isArchived, activityCategoryID, muscleGroups]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        compendiumCode: { type: string, pattern: '^[0-9]{5}$', example: '12050' }
        nameFr: { type: string, maxLength: 80 }
        nameEn: { type: string, maxLength: 80 }
        met: { type: number, minimum: 1, description: "MET brut du Compendium 2024, jamais modifié (RG29)." }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        instructionsFr: { type: [string, 'null'], maxLength: 2000 }
        instructionsEn: { type: [string, 'null'], maxLength: 2000 }
        isArchived: { type: boolean }
        activityCategoryID: { $ref: '#/components/schemas/Uuid' }
        muscleGroups:
          type: array
          items: { $ref: '#/components/schemas/MuscleGroup' }
    ActivityType:
      allOf:
        - { $ref: '#/components/schemas/ActivityTypeSummary' }
        - type: object
          required: [activityCategory]
          properties:
            activityCategory: { $ref: '#/components/schemas/ActivityCategory' }
    ActivityTypePage:
      type: object
      required: [items, metadata]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ActivityType' }
        metadata: { $ref: '#/components/schemas/PageMetadata' }
    CreateActivityTypeRequest:
      type: object
      required: [compendiumCode, nameFr, nameEn, met, activityCategoryID]
      properties:
        compendiumCode: { type: string, pattern: '^[0-9]{5}$' }
        nameFr: { type: string, minLength: 1, maxLength: 80 }
        nameEn: { type: string, minLength: 1, maxLength: 80 }
        met: { type: number, minimum: 1, description: "MET du Compendium pour ce code, recopié tel quel." }
        difficulty:
          description: Facultatif, tiré du MET par défaut (RG29).
          oneOf:
            - { $ref: '#/components/schemas/Difficulty' }
            - { type: 'null' }
        instructionsFr: { type: [string, 'null'], maxLength: 2000 }
        instructionsEn: { type: [string, 'null'], maxLength: 2000 }
        activityCategoryID: { $ref: '#/components/schemas/Uuid' }
        muscleGroupIDs:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
    UpdateActivityTypeRequest:
      type: object
      minProperties: 1
      description: Ni `met` ni `compendiumCode` (400 s'ils sont envoyés, RG29).
      properties:
        nameFr: { type: string, minLength: 1, maxLength: 80 }
        nameEn: { type: string, minLength: 1, maxLength: 80 }
        difficulty: { $ref: '#/components/schemas/Difficulty' }
        instructionsFr: { type: [string, 'null'], maxLength: 2000 }
        instructionsEn: { type: [string, 'null'], maxLength: 2000 }
        activityCategoryID: { $ref: '#/components/schemas/Uuid' }
        muscleGroupIDs:
          type: array
          uniqueItems: true
          items: { $ref: '#/components/schemas/Uuid' }
        isArchived: { type: boolean }

    # ------------------------------------------------------------ Aliments

    Compatibility:
      type: object
      description: |
        Étiquette calculée pour l'utilisateur connecté, à partir de son profil de santé (RG21).
        `incompatible` si une étiquette contredit un régime ou un allergène déclaré ; `unverified` si
        l'aliment n'a pas d'étiquettes vérifiées (« allergènes non renseignés », jamais compté compatible) ;
        sinon `compatible`. Sans profil de santé, seul `unverified` peut s'appliquer.
      required: [status, conflicts, notices]
      properties:
        status: { type: string, enum: [compatible, incompatible, unverified] }
        conflicts:
          type: array
          items: { $ref: '#/components/schemas/CompatibilityConflict' }
        notices:
          type: array
          description: |
            Mentions prudentes : `certification_unknown` pour une viande sans porc quand la préférence est halal
            ou casher ; `labels_not_verified` ; `contains_alcohol` pour information.
          items: { type: string, enum: [certification_unknown, labels_not_verified, contains_alcohol] }
    CompatibilityConflict:
      type: object
      required: [kind, code]
      properties:
        kind: { type: string, enum: [allergen, vegetarian, vegan, pork] }
        code: { type: string, description: "Code de l'allergène, ou rappel du régime contredit." }
    FoodSummary:
      type: object
      required: [id, nameFr, nameEn, kcal100g, protein100g, carbs100g, fat100g, foodGroupID, isCustom, isArchived, compatibility]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        nameFr: { type: string, maxLength: 150 }
        nameEn: { type: [string, 'null'], maxLength: 150 }
        kcal100g: { type: number, minimum: 0, maximum: 900 }
        protein100g: { type: number, minimum: 0, maximum: 100 }
        carbs100g: { type: number, minimum: 0, maximum: 100 }
        fat100g: { type: number, minimum: 0, maximum: 100 }
        foodGroupID:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        isCustom: { type: boolean, description: "Aliment personnalisé de l'utilisateur (RG19)." }
        isArchived: { type: boolean }
        compatibility: { $ref: '#/components/schemas/Compatibility' }
    FoodSummaryPage:
      type: object
      required: [items, metadata]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FoodSummary' }
        metadata: { $ref: '#/components/schemas/PageMetadata' }
    FoodPortion:
      type: object
      required: [id, labelFr, labelEn, grams, provenance]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        labelFr: { type: string, maxLength: 120 }
        labelEn: { type: [string, 'null'], maxLength: 120 }
        grams: { type: number, exclusiveMinimum: 0, maximum: 2000 }
        provenance: { type: [string, 'null'], maxLength: 200 }
    CreateFoodPortionRequest:
      type: object
      required: [labelFr, grams]
      properties:
        labelFr: { type: string, minLength: 1, maxLength: 120 }
        labelEn: { type: [string, 'null'], maxLength: 120, description: "Obligatoire pour un aliment de base ; recopie labelFr sinon (RG49)." }
        grams: { type: number, exclusiveMinimum: 0, maximum: 2000 }
        provenance: { type: [string, 'null'], maxLength: 200, description: "Back-office seulement." }
    FoodDetail:
      type: object
      required: [id, ciqualCode, nameFr, nameEn, kcal100g, protein100g, carbs100g, fat100g, fiber100g, alcohol100g, containsMeat, containsPork, containsAnimalProduct, containsAlcohol, labelsVerified, isArchived, isCustom, foodGroup, allergens, portions, compatibility, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        ciqualCode: { type: [string, 'null'], maxLength: 10 }
        nameFr: { type: string, maxLength: 150 }
        nameEn: { type: [string, 'null'], maxLength: 150 }
        kcal100g: { type: number, minimum: 0, maximum: 900 }
        protein100g: { type: number, minimum: 0, maximum: 100 }
        carbs100g: { type: number, minimum: 0, maximum: 100 }
        fat100g: { type: number, minimum: 0, maximum: 100 }
        fiber100g: { type: [number, 'null'], minimum: 0, maximum: 100, description: "Vide si inconnu." }
        alcohol100g: { type: [number, 'null'], minimum: 0, maximum: 100, description: "Vide si inconnu." }
        containsMeat: { type: boolean }
        containsPork: { type: boolean }
        containsAnimalProduct: { type: boolean }
        containsAlcohol: { type: boolean }
        labelsVerified: { type: boolean }
        isArchived: { type: boolean }
        isCustom: { type: boolean }
        foodGroup:
          oneOf:
            - { $ref: '#/components/schemas/FoodGroup' }
            - { type: 'null' }
        allergens:
          type: array
          items: { $ref: '#/components/schemas/Allergen' }
        portions:
          type: array
          items: { $ref: '#/components/schemas/FoodPortion' }
        compatibility:
          description: Absent du back-office, qui n'a pas de profil de santé.
          oneOf:
            - { $ref: '#/components/schemas/Compatibility' }
            - { type: 'null' }
        createdAt: { $ref: '#/components/schemas/Instant' }
    FoodValues:
      type: object
      description: |
        Valeurs pour 100 g et étiquettes d'un aliment, contrôlées par RG18 et RG21. Partagé par la création et la
        modification : aucun champ n'a de valeur par défaut dans le schéma, pour qu'un champ absent d'un PATCH
        reste inchangé.
      properties:
        nameFr: { type: string, minLength: 1, maxLength: 150 }
        nameEn: { type: [string, 'null'], maxLength: 150 }
        kcal100g: { type: number, minimum: 0, maximum: 900 }
        protein100g: { type: number, minimum: 0, maximum: 100 }
        carbs100g: { type: number, minimum: 0, maximum: 100 }
        fat100g: { type: number, minimum: 0, maximum: 100 }
        fiber100g: { type: [number, 'null'], minimum: 0, maximum: 100 }
        alcohol100g: { type: [number, 'null'], minimum: 0, maximum: 100 }
        foodGroupID:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        containsMeat: { type: boolean, description: "Faux si absent à la création ; inchangé si absent en modification." }
        containsPork: { type: boolean, description: "Faux si absent à la création ; inchangé si absent en modification." }
        containsAnimalProduct: { type: boolean, description: "Faux si absent à la création ; inchangé si absent en modification." }
        containsAlcohol: { type: boolean, description: "Faux si absent à la création ; inchangé si absent en modification." }
        labelsVerified: { type: boolean, description: "Étiquettes et allergènes renseignés (RG21). Faux si absent à la création ; inchangé si absent en modification." }
        allergenIDs:
          type: array
          uniqueItems: true
          maxItems: 14
          items: { $ref: '#/components/schemas/Uuid' }
    CreateCustomFoodRequest:
      allOf:
        - { $ref: '#/components/schemas/FoodValues' }
        - type: object
          required: [nameFr, kcal100g, protein100g, carbs100g, fat100g]
          properties:
            portions:
              type: array
              maxItems: 10
              items: { $ref: '#/components/schemas/CreateFoodPortionRequest' }
    UpdateCustomFoodRequest:
      allOf:
        - { $ref: '#/components/schemas/FoodValues' }
        - type: object
          minProperties: 1
    CreateBaseFoodRequest:
      allOf:
        - { $ref: '#/components/schemas/FoodValues' }
        - type: object
          required: [nameFr, nameEn, kcal100g, protein100g, carbs100g, fat100g, foodGroupID]
          properties:
            portions:
              type: array
              maxItems: 10
              items: { $ref: '#/components/schemas/CreateFoodPortionRequest' }
    UpdateBaseFoodRequest:
      allOf:
        - { $ref: '#/components/schemas/FoodValues' }
        - type: object
          minProperties: 1
          properties:
            isArchived: { type: boolean }
    AdminFoodSummary:
      type: object
      required: [id, ciqualCode, nameFr, nameEn, kcal100g, protein100g, carbs100g, fat100g, foodGroupID, labelsVerified, isArchived, usageCount, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        ciqualCode: { type: [string, 'null'] }
        nameFr: { type: string }
        nameEn: { type: string }
        kcal100g: { type: number }
        protein100g: { type: number }
        carbs100g: { type: number }
        fat100g: { type: number }
        foodGroupID: { $ref: '#/components/schemas/Uuid' }
        labelsVerified: { type: boolean }
        isArchived: { type: boolean }
        usageCount: { type: integer, minimum: 0, description: "Lignes de repas et de favoris qui l'utilisent ; 0 permet la suppression (RG46)." }
        createdAt: { $ref: '#/components/schemas/Instant' }
    AdminFoodPage:
      type: object
      required: [items, metadata]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminFoodSummary' }
        metadata: { $ref: '#/components/schemas/PageMetadata' }

    # ------------------------------------------------------------ Repas et favoris

    NutritionTotals:
      type: object
      description: Somme de valeurs de lignes, calculée par l'API (RG26), 2 décimales.
      required: [kcal, proteinG, carbsG, fatG]
      properties:
        kcal: { type: number, minimum: 0 }
        proteinG: { type: number, minimum: 0 }
        carbsG: { type: number, minimum: 0 }
        fatG: { type: number, minimum: 0 }
    LineQuantityInput:
      type: object
      description: |
        Soit `quantityG` (1 à 5 000), soit `foodPortionID` et `portionCount` (plus de 0), jamais les deux (RG20, RG24).
        Aucune valeur nutritionnelle n'est acceptée : l'API les calcule (RG24).
      required: [foodID]
      properties:
        foodID: { $ref: '#/components/schemas/Uuid' }
        quantityG: { type: number, minimum: 1, maximum: 5000 }
        foodPortionID: { $ref: '#/components/schemas/Uuid' }
        portionCount: { type: number, exclusiveMinimum: 0 }
      oneOf:
        - description: "Saisie en grammes."
          required: [quantityG]
          not: { anyOf: [ { required: [foodPortionID] }, { required: [portionCount] } ] }
        - description: "Saisie en unités."
          required: [foodPortionID, portionCount]
          not: { required: [quantityG] }
    MealItemInput:
      allOf:
        - { $ref: '#/components/schemas/LineQuantityInput' }
        - type: object
          properties:
            estimatedG:
              type: [number, 'null']
              minimum: 0
              maximum: 5000
              description: Grammes proposés par l'analyse photo, seulement si `origin = photo` (RG28).
    UpdateMealItemInput:
      allOf:
        - { $ref: '#/components/schemas/LineQuantityInput' }
        - type: object
          properties:
            id:
              description: Ligne existante à garder ; absent pour une nouvelle ligne (RG25).
              allOf:
                - { $ref: '#/components/schemas/Uuid' }
    CreateMealRequest:
      type: object
      required: [mealType, eatenOn, origin, items]
      properties:
        mealType: { $ref: '#/components/schemas/MealType' }
        eatenOn: { $ref: '#/components/schemas/LocalDate' }
        origin: { $ref: '#/components/schemas/MealOrigin' }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/MealItemInput' }
    UpdateMealRequest:
      type: object
      required: [mealType, eatenOn, items]
      properties:
        mealType: { $ref: '#/components/schemas/MealType' }
        eatenOn: { $ref: '#/components/schemas/LocalDate' }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/UpdateMealItemInput' }
    MealItem:
      type: object
      description: Ligne de repas, valeurs figées à l'enregistrement (RG25).
      required: [id, foodID, foodNameFr, foodNameEn, foodIsArchived, quantityG, foodPortionID, portionLabelFr, portionLabelEn, portionCount, kcal, proteinG, carbsG, fatG, estimatedG]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        foodID: { $ref: '#/components/schemas/Uuid' }
        foodNameFr: { type: string }
        foodNameEn: { type: [string, 'null'] }
        foodIsArchived: { type: boolean }
        quantityG: { type: number, minimum: 1, maximum: 5000 }
        foodPortionID:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        portionLabelFr: { type: [string, 'null'] }
        portionLabelEn: { type: [string, 'null'] }
        portionCount: { type: [number, 'null'] }
        kcal: { type: number, minimum: 0 }
        proteinG: { type: number, minimum: 0 }
        carbsG: { type: number, minimum: 0 }
        fatG: { type: number, minimum: 0 }
        estimatedG: { type: [number, 'null'] }
    Meal:
      type: object
      required: [id, mealType, eatenOn, origin, items, totals, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mealType: { $ref: '#/components/schemas/MealType' }
        eatenOn: { $ref: '#/components/schemas/LocalDate' }
        origin: { $ref: '#/components/schemas/MealOrigin' }
        items:
          type: array
          items: { $ref: '#/components/schemas/MealItem' }
        totals: { $ref: '#/components/schemas/NutritionTotals' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    MealDay:
      type: object
      required: [date, meals, totals]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        meals:
          type: array
          items: { $ref: '#/components/schemas/Meal' }
        totals: { $ref: '#/components/schemas/NutritionTotals' }
    MealDaysResponse:
      type: object
      required: [from, to, days, totals]
      properties:
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        days:
          type: array
          description: Seulement les jours qui ont au moins un repas renvoyé.
          items: { $ref: '#/components/schemas/MealDay' }
        totals: { $ref: '#/components/schemas/NutritionTotals' }
    FavoriteItem:
      type: object
      required: [id, foodID, foodNameFr, foodNameEn, foodIsArchived, quantityG, foodPortionID, portionLabelFr, portionLabelEn, portionCount, currentValues]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        foodID: { $ref: '#/components/schemas/Uuid' }
        foodNameFr: { type: string }
        foodNameEn: { type: [string, 'null'] }
        foodIsArchived: { type: boolean }
        quantityG: { type: number, minimum: 1, maximum: 5000 }
        foodPortionID:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        portionLabelFr: { type: [string, 'null'] }
        portionLabelEn: { type: [string, 'null'] }
        portionCount: { type: [number, 'null'] }
        currentValues: { $ref: '#/components/schemas/NutritionTotals' }
    FavoriteMeal:
      type: object
      required: [id, name, createdAt, items, totals]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 80 }
        createdAt: { $ref: '#/components/schemas/Instant' }
        items:
          type: array
          items: { $ref: '#/components/schemas/FavoriteItem' }
        totals: { $ref: '#/components/schemas/NutritionTotals' }
    CreateFavoriteMealRequest:
      type: object
      required: [name, items]
      properties:
        name: { type: string, minLength: 1, maxLength: 80, description: "Unique pour l'utilisateur (RG27)." }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/LineQuantityInput' }
    UpdateFavoriteMealRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/LineQuantityInput' }

    # ------------------------------------------------------------ Activités

    Activity:
      type: object
      required: [id, performedAt, performedOn, durationMin, kcal, kcalStatus, source, healthUUID, activityTypeID, activityTypeNameFr, activityTypeNameEn, activityCategoryID, activityCategoryCode, createdAt, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        performedAt: { $ref: '#/components/schemas/Instant' }
        performedOn:
          readOnly: true
          description: |
            Colonne `performed_on` : jour local de la séance, calculé par l'API depuis `performedAt` et le fuseau
            du profil, figé à l'enregistrement comme `eatenOn` (RG38). Lecture seule : le client ne l'envoie pas.
            Les filtres de dates et les statistiques par jour l'utilisent.
          allOf:
            - { $ref: '#/components/schemas/LocalDate' }
        durationMin: { type: integer, minimum: 1, maximum: 600 }
        kcal: { type: [number, 'null'], minimum: 0, maximum: 5000, description: "Vide si non renseignées (RG31)." }
        kcalStatus: { $ref: '#/components/schemas/KcalStatus' }
        source: { $ref: '#/components/schemas/DataSource' }
        healthUUID:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        activityTypeID: { $ref: '#/components/schemas/Uuid' }
        activityTypeNameFr: { type: string }
        activityTypeNameEn: { type: string }
        activityCategoryID: { $ref: '#/components/schemas/Uuid' }
        activityCategoryCode: { type: string }
        createdAt: { $ref: '#/components/schemas/Instant' }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    ActivityPage:
      type: object
      required: [items, metadata]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        metadata: { $ref: '#/components/schemas/PageMetadata' }
    CreateActivityRequest:
      type: object
      required: [activityTypeID, performedAt, durationMin]
      properties:
        activityTypeID: { $ref: '#/components/schemas/Uuid' }
        performedAt: { $ref: '#/components/schemas/Instant' }
        durationMin: { type: integer, minimum: 1, maximum: 600 }
        kcal: { type: [number, 'null'], minimum: 0, maximum: 5000, description: "Vide pour demander l'estimation (RG31)." }
        healthUUID:
          description: Objet écrit par ZakFit dans Santé (RG33).
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
    UpdateActivityRequest:
      type: object
      minProperties: 1
      properties:
        activityTypeID: { $ref: '#/components/schemas/Uuid' }
        performedAt: { $ref: '#/components/schemas/Instant' }
        durationMin: { type: integer, minimum: 1, maximum: 600 }
        kcal: { type: [number, 'null'], minimum: 0, maximum: 5000, description: "null explicite pour estimer de nouveau." }
        healthUUID:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
    EstimateActivityRequest:
      type: object
      required: [activityTypeID, durationMin]
      properties:
        activityTypeID: { $ref: '#/components/schemas/Uuid' }
        durationMin: { type: integer, minimum: 1, maximum: 600 }
    ActivityEstimateResponse:
      type: object
      required: [kcal, kcalStatus, met, weightKg, durationMin, unavailableReason, outsideFormulaAgeRange]
      properties:
        kcal: { type: [number, 'null'] }
        kcalStatus: { type: string, enum: [estimated, unknown] }
        met: { type: number }
        weightKg: { type: [number, 'null'], description: "Poids de la dernière pesée utilisé." }
        durationMin: { type: integer }
        unavailableReason: { type: [string, 'null'], enum: [no_consent, no_weight, null] }
        outsideFormulaAgeRange: { type: boolean, description: "Âge hors de 19 à 59 ans (Compendium adulte)." }
    HealthWorkoutInput:
      type: object
      required: [healthUUID, healthWorkoutType, performedAt, durationMin]
      properties:
        healthUUID: { $ref: '#/components/schemas/Uuid' }
        healthWorkoutType:
          type: string
          description: Nom du cas de `HKWorkoutActivityType` (par exemple running), traduit par la table fixe de l'API (RG33).
          example: running
        performedAt: { $ref: '#/components/schemas/Instant' }
        durationMin: { type: integer, description: "Arrondi à la minute par l'app." }
        kcal: { type: [number, 'null'], minimum: 0, maximum: 5000 }
    ImportHealthActivitiesRequest:
      type: object
      required: [workouts]
      properties:
        workouts:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/HealthWorkoutInput' }
    ImportRejection:
      type: object
      required: [reference, reason]
      properties:
        reference: { type: string, description: "healthUUID ou jour de l'élément refusé." }
        reason: { type: string, description: "Raison en français." }
    ActivityImportResult:
      type: object
      required: [received, imported, skippedDuplicates, skippedIgnored, skippedOwnSource, skippedUnmapped, rejected]
      properties:
        received: { type: integer }
        imported: { type: integer }
        skippedDuplicates: { type: integer }
        skippedIgnored: { type: integer }
        skippedOwnSource: { type: integer }
        skippedUnmapped: { type: integer, description: "Séances sans équivalent dans le référentiel, affichées par l'app (RG33)." }
        rejected:
          type: array
          items: { $ref: '#/components/schemas/ImportRejection' }

    # ------------------------------------------------------------ Pesées et énergie active

    WeighIn:
      type: object
      required: [id, weighedOn, weightKg, source, healthUUID, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        weighedOn: { $ref: '#/components/schemas/LocalDate' }
        weightKg: { type: number, minimum: 30, maximum: 300 }
        source: { $ref: '#/components/schemas/DataSource' }
        healthUUID:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        createdAt: { $ref: '#/components/schemas/Instant' }
    CreateWeighInRequest:
      type: object
      required: [weighedOn, weightKg]
      properties:
        weighedOn: { $ref: '#/components/schemas/LocalDate' }
        weightKg: { type: number, minimum: 30, maximum: 300 }
        healthUUID:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        replaceExisting: { type: boolean, default: false, description: "Confirmation du remplacement de la pesée du jour (RG39)." }
    HealthWeighInInput:
      type: object
      required: [healthUUID, weighedOn, weightKg]
      properties:
        healthUUID: { $ref: '#/components/schemas/Uuid' }
        weighedOn: { $ref: '#/components/schemas/LocalDate' }
        weightKg: { type: number }
    ImportHealthWeighInsRequest:
      type: object
      required: [weighIns]
      properties:
        weighIns:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/HealthWeighInInput' }
    WeighInImportResult:
      type: object
      required: [received, imported, updated, skippedDuplicates, skippedIgnored, skippedManualSameDay, skippedOwnSource, rejected]
      properties:
        received: { type: integer }
        imported: { type: integer }
        updated: { type: integer }
        skippedDuplicates: { type: integer }
        skippedIgnored: { type: integer, description: "Jours dont la pesée importée a été supprimée par l'utilisateur (RG39)." }
        skippedManualSameDay: { type: integer }
        skippedOwnSource: { type: integer }
        rejected:
          type: array
          items: { $ref: '#/components/schemas/ImportRejection' }
    DailyActiveEnergy:
      type: object
      required: [id, day, kcal, importedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        day: { $ref: '#/components/schemas/LocalDate' }
        kcal: { type: number, minimum: 0, maximum: 10000 }
        importedAt: { $ref: '#/components/schemas/Instant' }
    ImportActiveEnergyRequest:
      type: object
      required: [days]
      properties:
        days:
          type: array
          minItems: 1
          maxItems: 400
          items:
            type: object
            required: [day, kcal]
            properties:
              day: { $ref: '#/components/schemas/LocalDate' }
              kcal: { type: number, minimum: 0, maximum: 10000 }
    ActiveEnergyImportResult:
      type: object
      required: [received, imported, updated, rejected]
      properties:
        received: { type: integer }
        imported: { type: integer }
        updated: { type: integer }
        rejected:
          type: array
          items: { $ref: '#/components/schemas/ImportRejection' }

    # ------------------------------------------------------------ Objectifs

    CalorieGoalResponse:
      type: object
      required: [id, mode, manualKcal, effectiveKcal, computation, proteinGTarget, carbsGTarget, fatGTarget, macrosCustom, warnings, updatedAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        mode: { $ref: '#/components/schemas/CalorieGoalMode' }
        manualKcal: { type: [integer, 'null'], minimum: 1200, maximum: 6000 }
        effectiveKcal: { type: integer, minimum: 1200, maximum: 6000, description: "Cible effective, calculée ou saisie." }
        computation:
          description: Détail du calcul en mode computed, `null` en mode manual.
          oneOf:
            - { $ref: '#/components/schemas/CalorieGoalComputation' }
            - { type: 'null' }
        proteinGTarget: { type: integer, minimum: 0, maximum: 1000 }
        carbsGTarget: { type: integer, minimum: 0, maximum: 1000 }
        fatGTarget: { type: integer, minimum: 0, maximum: 1000 }
        macrosCustom: { type: boolean }
        warnings:
          type: array
          description: |
            Avertissements sans refus : `below_resting_energy` (RG35), `macros_energy_mismatch` (écart de plus de 10 %,
            RG36), `macros_outside_anses` (répartition hors des intervalles de l'ANSES), `age_outside_formula_range` (RG12).
          items: { type: string, enum: [below_resting_energy, macros_energy_mismatch, macros_outside_anses, age_outside_formula_range] }
        updatedAt: { $ref: '#/components/schemas/Instant' }
    CalorieGoalComputation:
      type: object
      required: [restingKcal, pal, totalKcal, orientationAdjustmentKcal, floorApplied, ceilingApplied]
      properties:
        restingKcal: { type: integer, description: "Dépense de repos Mifflin-St Jeor, arrondie à l'unité." }
        pal: { type: number, enum: [1.4, 1.6, 1.8, 2.0] }
        totalKcal: { type: integer, description: "Dépense de repos × PAL." }
        orientationAdjustmentKcal: { type: integer, enum: [-500, 0, 300] }
        floorApplied: { type: boolean, description: "Le plancher (dépense de repos ou 1 200 kcal) a joué." }
        ceilingApplied: { type: boolean, description: "Le plafond de 6 000 kcal a joué." }
    SaveCalorieGoalRequest:
      type: object
      required: [mode, macrosCustom]
      properties:
        mode: { $ref: '#/components/schemas/CalorieGoalMode' }
        manualKcal: { type: [integer, 'null'], minimum: 1200, maximum: 6000, description: "Obligatoire en mode manual, vide en mode computed." }
        macrosCustom: { type: boolean }
        proteinGTarget: { type: integer, minimum: 0, maximum: 1000, description: "Obligatoire si macrosCustom." }
        carbsGTarget: { type: integer, minimum: 0, maximum: 1000 }
        fatGTarget: { type: integer, minimum: 0, maximum: 1000 }
      allOf:
        - if: { properties: { mode: { const: manual } } }
          then: { required: [manualKcal], properties: { manualKcal: { type: integer } } }
          else: { properties: { manualKcal: { type: 'null' } } }
        - if: { properties: { macrosCustom: { const: true } } }
          then: { required: [proteinGTarget, carbsGTarget, fatGTarget] }
    CalorieTargetVersion:
      type: object
      required: [id, effectiveFrom, kcalTarget, proteinGTarget, carbsGTarget, fatGTarget, mode]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        effectiveFrom: { $ref: '#/components/schemas/LocalDate' }
        kcalTarget: { type: integer, minimum: 1200, maximum: 6000 }
        proteinGTarget: { type: integer }
        carbsGTarget: { type: integer }
        fatGTarget: { type: integer }
        mode: { $ref: '#/components/schemas/CalorieGoalMode' }
    ActivityGoal:
      type: object
      required: [id, metric, period, activityCategoryID, activityCategoryCode, targetValue, validFrom, validTo, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        metric: { $ref: '#/components/schemas/GoalMetric' }
        period: { $ref: '#/components/schemas/GoalPeriod' }
        activityCategoryID:
          description: Vide pour toutes les activités.
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        activityCategoryCode: { type: [string, 'null'] }
        targetValue: { type: integer, minimum: 1 }
        validFrom: { $ref: '#/components/schemas/LocalDate' }
        validTo:
          description: Vide tant que l'objectif est en cours (RG37).
          oneOf:
            - { $ref: '#/components/schemas/LocalDate' }
            - { type: 'null' }
        createdAt: { $ref: '#/components/schemas/Instant' }
    CreateActivityGoalRequest:
      type: object
      required: [metric, period, targetValue]
      properties:
        metric: { $ref: '#/components/schemas/GoalMetric' }
        period: { $ref: '#/components/schemas/GoalPeriod' }
        activityCategoryID:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        targetValue: { type: integer, minimum: 1 }
    UpdateActivityGoalRequest:
      type: object
      required: [targetValue]
      properties:
        targetValue: { type: integer, minimum: 1 }

    # ------------------------------------------------------------ Tableau de bord et historique

    DayCalorieTarget:
      type: object
      description: Version de l'objectif qui s'applique au jour demandé (RG52).
      required: [kcalTarget, proteinGTarget, carbsGTarget, fatGTarget, mode, effectiveFrom]
      properties:
        kcalTarget: { type: integer }
        proteinGTarget: { type: integer }
        carbsGTarget: { type: integer }
        fatGTarget: { type: integer }
        mode: { $ref: '#/components/schemas/CalorieGoalMode' }
        effectiveFrom: { $ref: '#/components/schemas/LocalDate' }
    MacroProgress:
      type: object
      required: [macro, consumedG, targetG, percent]
      properties:
        macro: { $ref: '#/components/schemas/Macro' }
        consumedG: { type: number }
        targetG: { type: integer }
        percent: { type: number, description: "Consommé / objectif × 100, à 0,1 près." }
    BurnedSummary:
      type: object
      description: Kcal brûlées du jour (RG40).
      required: [kcal, sessions, minutes, incomplete]
      properties:
        kcal: { type: number, description: "Somme des kcal saisies, estimées ou importées, hors séances non renseignées." }
        sessions: { type: integer }
        minutes: { type: integer }
        incomplete: { type: boolean, description: "Au moins une séance non renseignée (RG31)." }
    ActivityGoalProgress:
      type: object
      required: [activityGoalID, metric, period, activityCategoryID, targetValue, periodStart, periodEnd, achievedValue, percent, reached]
      properties:
        activityGoalID: { $ref: '#/components/schemas/Uuid' }
        metric: { $ref: '#/components/schemas/GoalMetric' }
        period: { $ref: '#/components/schemas/GoalPeriod' }
        activityCategoryID:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        targetValue: { type: integer }
        periodStart: { $ref: '#/components/schemas/LocalDate' }
        periodEnd: { $ref: '#/components/schemas/LocalDate' }
        achievedValue: { type: number, description: "Pour period = session, la meilleure séance du jour." }
        percent: { type: number }
        reached: { type: boolean }
    DashboardAlert:
      type: object
      required: [code, macro, percent, excessKcal]
      properties:
        code: { type: string, enum: [calorie_goal_exceeded, macro_low, macro_high] }
        macro:
          oneOf:
            - { $ref: '#/components/schemas/Macro' }
            - { type: 'null' }
        percent: { type: [number, 'null'] }
        excessKcal: { type: [number, 'null'], description: "Dépassement de l'objectif calorique en kcal." }
    DashboardRecommendation:
      type: object
      required: [code, macro, missingG, activityGoalID, activityTypeID, minutes, kcal]
      properties:
        code: { type: string, enum: [macro_missing, activity_suggestion] }
        macro:
          oneOf:
            - { $ref: '#/components/schemas/Macro' }
            - { type: 'null' }
        missingG: { type: [number, 'null'], description: "« Il te manque X g » (RG41)." }
        activityGoalID:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        activityTypeID:
          description: Activité la plus pratiquée, ou marche rapide sans historique (RG41).
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        minutes: { type: [integer, 'null'] }
        kcal: { type: [number, 'null'], description: "Vide sans poids connu (RG41)." }
    DashboardResponse:
      type: object
      required: [date, generatedAt, consumed, mealsCount, calorieTarget, balanceKcal, macros, burned, activeEnergyKcal, weekMinutes, activityGoals, alerts, recommendations]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        generatedAt: { $ref: '#/components/schemas/Instant' }
        consumed: { $ref: '#/components/schemas/NutritionTotals' }
        mealsCount: { type: integer }
        calorieTarget:
          oneOf:
            - { $ref: '#/components/schemas/DayCalorieTarget' }
            - { type: 'null' }
        balanceKcal: { type: [number, 'null'], description: "Consommé moins objectif (`02-formules.md` §8)." }
        macros:
          type: array
          items: { $ref: '#/components/schemas/MacroProgress' }
        burned: { $ref: '#/components/schemas/BurnedSummary' }
        activeEnergyKcal: { type: [number, 'null'], description: "Énergie active de Santé, à part, hors calcul (RG40)." }
        weekMinutes: { type: integer, description: "Minutes d'activité de la semaine ISO du jour." }
        activityGoals:
          type: array
          items: { $ref: '#/components/schemas/ActivityGoalProgress' }
        alerts:
          type: array
          items: { $ref: '#/components/schemas/DashboardAlert' }
        recommendations:
          type: array
          items: { $ref: '#/components/schemas/DashboardRecommendation' }
    HistoryPeriodSummary:
      type: object
      required: [consumed, burnedKcal, burnedIncomplete, sessions, activityMinutes, mealsCount, daysLogged, targetKcal, daysWithTarget]
      properties:
        periodStart: { $ref: '#/components/schemas/LocalDate' }
        periodEnd: { $ref: '#/components/schemas/LocalDate' }
        consumed: { $ref: '#/components/schemas/NutritionTotals' }
        burnedKcal: { type: number }
        burnedIncomplete: { type: boolean }
        sessions: { type: integer }
        activityMinutes: { type: integer }
        mealsCount: { type: integer }
        daysLogged: { type: integer, description: "Jours qui ont au moins un repas." }
        targetKcal: { type: [integer, 'null'], description: "Somme des cibles des jours qui en ont une (RG52)." }
        daysWithTarget: { type: integer }
    HistorySummaryResponse:
      type: object
      required: [from, to, groupBy, periods, totals]
      properties:
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        groupBy: { type: string, enum: [day, week, month] }
        periods:
          type: array
          description: Toutes les périodes de la plage, même vides ; une semaine ou un mois coupé par la plage est réduit à la plage.
          items: { $ref: '#/components/schemas/HistoryPeriodSummary' }
        totals: { $ref: '#/components/schemas/HistoryPeriodSummary' }
    HistoryDayResponse:
      type: object
      required: [date, meals, consumed, activities, burned, activeEnergyKcal, calorieTarget, weighIn]
      properties:
        date: { $ref: '#/components/schemas/LocalDate' }
        meals:
          type: array
          items: { $ref: '#/components/schemas/Meal' }
        consumed: { $ref: '#/components/schemas/NutritionTotals' }
        activities:
          type: array
          items: { $ref: '#/components/schemas/Activity' }
        burned: { $ref: '#/components/schemas/BurnedSummary' }
        activeEnergyKcal: { type: [number, 'null'] }
        calorieTarget:
          oneOf:
            - { $ref: '#/components/schemas/DayCalorieTarget' }
            - { type: 'null' }
        weighIn:
          oneOf:
            - { $ref: '#/components/schemas/WeighIn' }
            - { type: 'null' }

    # ------------------------------------------------------------ Rappels

    ReminderSetting:
      type: object
      required: [id, kind, isEnabled, sendTime]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/ReminderKind' }
        isEnabled: { type: boolean }
        sendTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', description: "Heure locale, au format hh:mm." }
    UpdateReminderSettingRequest:
      type: object
      minProperties: 1
      properties:
        isEnabled: { type: boolean }
        sendTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }

    # ------------------------------------------------------------ Back-office

    AdminActivityGoalSummary:
      type: object
      description: Objectif d'activité en cours, sans donnée de santé (RG45).
      required: [metric, period, activityCategoryID, activityCategoryCode, targetValue]
      properties:
        metric: { $ref: '#/components/schemas/GoalMetric' }
        period: { $ref: '#/components/schemas/GoalPeriod' }
        activityCategoryID:
          oneOf:
            - { $ref: '#/components/schemas/Uuid' }
            - { type: 'null' }
        activityCategoryCode: { type: [string, 'null'] }
        targetValue: { type: integer }
    AdminUserSummary:
      type: object
      description: Ligne de la liste des utilisateurs (RG45). Ni poids, ni allergènes, ni régimes, ni orientation, ni valeur calculée.
      required: [id, lastName, firstName, email, role, status, blockedUntil, createdAt, activitiesCount, calorieGoalMode, activityGoals, lastLoginAt, loginsLast30Days]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        lastName: { type: string }
        firstName: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        blockedUntil:
          oneOf:
            - { $ref: '#/components/schemas/Instant' }
            - { type: 'null' }
        createdAt: { $ref: '#/components/schemas/Instant' }
        activitiesCount: { type: integer }
        calorieGoalMode:
          oneOf:
            - { $ref: '#/components/schemas/CalorieGoalMode' }
            - { type: 'null' }
        activityGoals:
          type: array
          items: { $ref: '#/components/schemas/AdminActivityGoalSummary' }
        lastLoginAt:
          oneOf:
            - { $ref: '#/components/schemas/Instant' }
            - { type: 'null' }
        loginsLast30Days: { type: integer }
    AdminUserDetail:
      allOf:
        - { $ref: '#/components/schemas/AdminUserSummary' }
        - type: object
          required: [mealsCount, favoriteMealsCount, customFoodsCount]
          properties:
            mealsCount: { type: integer }
            favoriteMealsCount: { type: integer }
            customFoodsCount: { type: integer }
    AdminUserPage:
      type: object
      required: [items, metadata]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminUserSummary' }
        metadata: { $ref: '#/components/schemas/PageMetadata' }
    UpdateUserStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/UserStatus' }
        blockedUntil:
          description: Seulement avec status = blocked, instant futur, facultatif (RG06).
          oneOf:
            - { $ref: '#/components/schemas/Instant' }
            - { type: 'null' }
    CountByKey:
      type: object
      required: [key, count]
      properties:
        key: { type: string }
        count: { type: integer }
    CategoryCount:
      type: object
      required: [activityCategoryID, code, count, minutes]
      properties:
        activityCategoryID: { $ref: '#/components/schemas/Uuid' }
        code: { type: string }
        count: { type: integer }
        minutes: { type: integer }
    StatsSeriesPoint:
      type: object
      required: [periodStart, registrations, logins, activeUsers, meals, activities]
      properties:
        periodStart: { $ref: '#/components/schemas/LocalDate' }
        registrations: { type: integer }
        logins: { type: integer }
        activeUsers: { type: integer }
        meals: { type: integer }
        activities: { type: integer }
    DistributionGroup:
      type: object
      required: [key, count, masked]
      properties:
        key:
          type: string
          enum: [18-29, 30-44, 45+, female, male, lose, maintain, gain]
          description: |
            Tranche d'âge (`18-29`, `30-44`, `45+`), sexe (`female`, `male`) ou orientation (`lose`, `maintain`, `gain`),
            selon la répartition.
        count: { type: [integer, 'null'], minimum: 0, description: "Vide si le groupe est masqué (RG47) ; 0 est affiché." }
        masked: { type: boolean }
    Distribution:
      type: object
      description: Répartition anonyme ; groupes de moins de 5 personnes masqués (RG47).
      required: [total, masked, groups]
      properties:
        total: { type: [integer, 'null'], description: "Vide si la répartition entière est masquée." }
        masked: { type: boolean }
        groups:
          type: array
          items: { $ref: '#/components/schemas/DistributionGroup' }
    AdminStatsResponse:
      type: object
      required: [from, to, granularity, minGroupSize, users, logins, meals, activities, goals, series, distributions]
      properties:
        from: { $ref: '#/components/schemas/LocalDate' }
        to: { $ref: '#/components/schemas/LocalDate' }
        granularity: { type: string, enum: [day, week, month] }
        minGroupSize: { type: integer, const: 5 }
        users:
          type: object
          required: [total, registeredInPeriod, activeInPeriod, byStatus]
          properties:
            total: { type: integer, description: "Comptes de rôle user." }
            registeredInPeriod: { type: integer }
            activeInPeriod: { type: integer, description: "Au moins une connexion dans la plage (RG53)." }
            byStatus:
              type: object
              required: [active, blocked, suspended]
              properties:
                active: { type: integer }
                blocked: { type: integer }
                suspended: { type: integer }
        logins:
          type: object
          required: [total, averagePerActiveUser]
          properties:
            total: { type: integer }
            averagePerActiveUser: { type: number }
        meals:
          type: object
          required: [total, byType]
          properties:
            total: { type: integer }
            byType:
              type: array
              items: { $ref: '#/components/schemas/CountByKey' }
        activities:
          type: object
          required: [total, totalMinutes, byCategory]
          properties:
            total: { type: integer }
            totalMinutes: { type: integer }
            byCategory:
              type: array
              items: { $ref: '#/components/schemas/CategoryCount' }
        goals:
          type: object
          required: [calorieGoalModes, usersWithActivityGoals, activityGoalPeriodsEvaluated, activityGoalPeriodsReached, loggedDays, loggedDaysWithinCalorieTarget]
          properties:
            calorieGoalModes:
              type: object
              required: [computed, manual]
              properties:
                computed: { type: integer }
                manual: { type: integer }
            usersWithActivityGoals: { type: integer }
            activityGoalPeriodsEvaluated: { type: integer, description: "Périodes closes (jours ou semaines) d'objectifs d'activité dans la plage." }
            activityGoalPeriodsReached: { type: integer }
            loggedDays: { type: integer, description: "Couples utilisateur-jour avec au moins un repas." }
            loggedDaysWithinCalorieTarget: { type: integer, description: "Parmi eux, jours où le consommé ne dépasse pas la cible du jour (RG52)." }
        series:
          type: array
          items: { $ref: '#/components/schemas/StatsSeriesPoint' }
        distributions:
          type: object
          required: [ageBands, sex, goalOrientation]
          properties:
            ageBands:
              description: "Trois groupes dans cet ordre : 18-29, 30-44, 45+ (RG47)."
              allOf:
                - { $ref: '#/components/schemas/Distribution' }
            sex: { $ref: '#/components/schemas/Distribution' }
            goalOrientation: { $ref: '#/components/schemas/Distribution' }
    AdminAction:
      type: object
      required: [id, action, targetKind, targetID, performedAt, adminID, adminFirstName, adminLastName]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        action: { $ref: '#/components/schemas/AdminActionKind' }
        targetKind: { $ref: '#/components/schemas/AdminTargetKind' }
        targetID: { $ref: '#/components/schemas/Uuid' }
        performedAt: { $ref: '#/components/schemas/Instant' }
        adminID: { $ref: '#/components/schemas/Uuid' }
        adminFirstName: { type: string }
        adminLastName: { type: string }
    AdminActionPage:
      type: object
      required: [items, metadata]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminAction' }
        metadata: { $ref: '#/components/schemas/PageMetadata' }
