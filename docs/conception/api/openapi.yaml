openapi: 3.1.0
info:
  title: ZakFit API
  version: 1.0.0
  summary: Contrat de l'API REST de ZakFit (Vapor 4, MariaDB, JWT).
  description: |
    Contrat de l'API de ZakFit, version 1 du 27/11/2026.

    Sources qui font foi : `01-analyse-fonctionnelle.md` (UC, US, RG01 à RG53),
    `02-formules.md`, `03-dictionnaire.md`, `04-mcd-mld-mpd.md` et `sql/01-schema.sql`.
    La synthèse pour le correcteur est dans `05-contrat-api.md`.

    **Conventions**
    - Routes publiques sous `/auth`. Routes de l'app iOS sous `/appios`, avec un jeton JWT.
      Routes du back-office sous `/backoffice`, avec un jeton JWT et le rôle `admin` (RG44).
    - À chaque requête protégée, `JWTMiddleware` vérifie le jeton, puis `AccountStatusMiddleware` relit le compte
      en base (statut) et le range dans la requête ; sur `/backoffice`, `AdminMiddleware` contrôle le rôle de ce compte
      relu, jamais un rôle lu dans le jeton (RG05, RG06, RG44).
    - Noms JSON en camelCase anglais, tirés des colonnes du modèle (`kcal_100g` donne `kcal100g`,
      `protein_g_target` donne `proteinGTarget`). L'identifiant propre d'une ressource s'appelle `id` ;
      une clé étrangère prend le suffixe `ID` (`id_food` donne `foodID`), comme dans LineUp.
    - Identifiants : UUID en chaîne. Instants : ISO 8601 en UTC (`2026-11-27T11:30:00Z`).
      Jours locaux : `AAAA-MM-JJ`, calculés dans le fuseau du profil (RG23, RG38).
    - Nombres décimaux (grammes, kcal) : nombres JSON à 2 décimales au plus, sans arrondi intermédiaire.
      L'arrondi d'affichage (kcal à l'unité, grammes à 0,1 g, 0,5 vers le haut) est fait par le client
      (`02-formules.md` §5).
    - Erreurs au format de Vapor : `{ "error": true, "reason": "message en français" }`.
    - Pagination au format de Vapor : `{ "items": [...], "metadata": { "page", "per", "total" } }`,
      paramètres `page` (1 par défaut) et `per` (10 par défaut, 100 au plus).
  contact:
    name: ZakFit (projet de formation Simplon)
servers:
  - url: http://localhost:8080
    description: API locale (Vapor), joignable par le réseau local, sans HTTPS (hors périmètre de la version 1)
security:
  - bearerAuth: []
tags:
  - name: Authentification
    description: Inscription et connexion, sans jeton.
  - name: Profil
    description: Compte de l'utilisateur connecté.
  - name: Consentement santé
    description: Consentement RGPD article 9 (RG10, RG11).
  - name: Profil de santé
    description: Données de santé, seulement avec un consentement actif.
  - name: Référentiels
    description: Listes de référence, lisibles par tout compte connecté, back-office compris.
  - name: Aliments
  - name: Repas
  - name: Favoris
  - name: Activités
  - name: Pesées
  - name: Énergie active
  - name: Objectifs
  - name: Tableau de bord
  - name: Historique
  - name: Rappels
  - name: Export
  - name: Back-office utilisateurs
  - name: Back-office aliments
  - name: Back-office types d'activité
  - name: Back-office statistiques
  - name: Back-office journal

paths:

  # ---------------------------------------------------------------- Authentification

  /auth/register:
    post:
      tags: [Authentification]
      operationId: register
      summary: Créer un compte utilisateur
      description: |
        UC01, US01. Crée un compte avec le rôle `user` et le statut `active` (RG07).
        - L'email est nettoyé (espaces retirés), mis en minuscules et doit être unique sans tenir compte de la casse (RG01).
        - Le mot de passe respecte RG02 (8 caractères au moins, une lettre et un chiffre, 72 octets UTF-8 au plus),
          et la confirmation doit être identique. Il est haché avec bcrypt (RG03) et n'est jamais renvoyé.
        - La case « J'ai 18 ans ou plus » est obligatoire : `adultDeclared` doit valoir `true`,
          et l'API enregistre l'instant dans `adult_declared_at` (RG12).
        - Le fuseau est facultatif, `Europe/Paris` par défaut (RG23).
        - L'API crée aussi les quatre réglages de rappel par défaut, activés à 18:00 (RG42).
        - Aucun jeton n'est renvoyé : l'app affiche ensuite l'écran de connexion (US01).
      security: []
      x-role: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              lastName: LeBoss
              firstName: Zak
              email: Zak.LeBoss@Example.com
              password: ZakFit2026
              passwordConfirmation: ZakFit2026
              adultDeclared: true
              timeZone: Europe/Paris
      responses:
        '201':
          description: Compte créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
              example:
                id: 3f2b8c1e-7a4d-4e9b-9c21-5d6e8f0a1b2c
                lastName: LeBoss
                firstName: Zak
                email: zak.leboss@example.com
                role: user
                status: active
                timeZone: Europe/Paris
                adultDeclaredAt: '2026-11-27T09:12:00Z'
                healthConsentActive: false
                calorieGoalDefined: false
                createdAt: '2026-11-27T09:12:00Z'
                updatedAt: '2026-11-27T09:12:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email déjà utilisé (RG01).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: true, reason: Cet email est déjà utilisé. }

  /auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Se connecter (app iOS et back-office)
      description: |
        UC02, UC30, US02. Vérifie l'email et le mot de passe, puis renvoie un jeton JWT signé,
        valable 7 jours, qui ne contient que l'identifiant de l'utilisateur et l'expiration (RG05).
        - Échec : toujours le même message, que l'email existe ou non (RG04).
        - Ordre des contrôles : le mot de passe d'abord. Le statut n'est examiné qu'après un mot de passe correct,
          pour qu'un 403 ne révèle jamais qu'un email existe (RG04).
        - Compte bloqué ou suspendu, mot de passe correct : 403 explicite (RG06). Un blocage dont `blockedUntil`
          est passé est levé à cette requête : le statut repasse à `active`.
        - Le fuseau envoyé par l'app met à jour le profil (RG23).
        - Chaque connexion réussie crée une ligne `login_event`, avec la date seulement (RG53).
        - Le back-office utilise la même route et refuse l'accès si `user.role` ne vaut pas `admin` (US30, RG44).
        - Il n'y a pas de route de déconnexion : l'app efface le jeton du Trousseau (RG08).
      security: []
      x-role: public
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example:
              email: zak.leboss@example.com
              password: ZakFit2026
              timeZone: Europe/Paris
      responses:
        '200':
          description: Connexion réussie.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIzZjJiOGMxZSJ9.signature
                expiresAt: '2026-12-04T09:15:00Z'
                user:
                  id: 3f2b8c1e-7a4d-4e9b-9c21-5d6e8f0a1b2c
                  lastName: LeBoss
                  firstName: Zak
                  email: zak.leboss@example.com
                  role: user
                  status: active
                  timeZone: Europe/Paris
                  adultDeclaredAt: '2026-11-27T09:12:00Z'
                  healthConsentActive: true
                  calorieGoalDefined: true
                  createdAt: '2026-11-27T09:12:00Z'
                  updatedAt: '2026-11-27T09:15:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Identifiants invalides, message unique (RG04).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example: { error: true, reason: Email ou mot de passe incorrect. }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Profil

  /appios/profile:
    get:
      tags: [Profil]
      operationId: showProfile
      summary: Lire son profil
      description: |
        UC05, US04. Renvoie le compte de l'utilisateur lu dans le jeton, jamais d'après l'URL (RG09).
        `healthConsentActive` et `calorieGoalDefined` permettent à l'app de reprendre le questionnaire
        de démarrage là où il s'est arrêté (UC03, US03). Le hash du mot de passe n'est jamais renvoyé (RG03).
      x-role: user
      responses:
        '200':
          description: Profil.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Profil]
      operationId: updateProfile
      summary: Modifier son nom, son prénom ou son email
      description: |
        UC05, US04. Champs absents : inchangés. Un nouvel email est mis en minuscules
        et doit rester unique (RG01). Le mot de passe et le fuseau ont leurs propres routes.
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
            example: { firstName: Zakaria }
      responses:
        '200':
          description: Profil modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Profil]
      operationId: deleteProfile
      summary: Supprimer son compte
      description: |
        UC07, US07, RG43. Demande le mot de passe. Efface toutes les données du compte dans une
        transaction : repas, puis favoris, puis le compte, dont la cascade efface le reste
        (aliments personnalisés, activités, pesées, objectifs, consentements, connexions).
        Ce qui est dans l'app Santé n'est pas touché.
        - Mot de passe incorrect : 400 (et non 401, pour que l'app ne prenne pas l'erreur pour un jeton expiré).
        - Un administrateur ne peut pas supprimer son propre compte (RG07, RG48) : 409.
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordConfirmationRequest' }
            example: { password: ZakFit2026 }
      responses:
        '204': { description: "Compte et données supprimés." }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appios/profile/password:
    patch:
      tags: [Profil]
      operationId: updatePassword
      summary: Changer de mot de passe
      description: |
        UC05, US04. Demande l'ancien mot de passe. Le nouveau respecte RG02 et est haché avec bcrypt (RG03).
        Ancien mot de passe incorrect : 400. Les jetons déjà émis restent valables jusqu'à leur expiration (RG08).
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePasswordRequest' }
            example:
              currentPassword: ZakFit2026
              newPassword: Muscu2027
              newPasswordConfirmation: Muscu2027
      responses:
        '204': { description: "Mot de passe changé." }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /appios/profile/time-zone:
    patch:
      tags: [Profil]
      operationId: updateTimeZone
      summary: Enregistrer le fuseau horaire de l'appareil
      description: |
        UC05, RG23, RG38. L'app l'envoie quand le fuseau de l'appareil change (il est aussi envoyé à la connexion).
        La valeur doit être un nom IANA connu (64 caractères au plus). Le fuseau sert à calculer les jours locaux,
        les semaines ISO et les mois civils.
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTimeZoneRequest' }
            example: { timeZone: America/Montreal }
      responses:
        '200':
          description: Fuseau enregistré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Consentement santé

  /appios/health-consents:
    get:
      tags: [Consentement santé]
      operationId: listHealthConsents
      summary: Lire l'historique de ses consentements
      description: |
        UC04, UC28, RG10, RG11. Du plus récent au plus ancien. Le consentement actif est celui dont `withdrawnAt` est vide.
        L'historique est gardé après un retrait, comme preuve (RGPD article 7).
      x-role: user
      responses:
        '200':
          description: Consentements.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/HealthConsentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Consentement santé]
      operationId: grantHealthConsent
      summary: Donner son consentement santé
      description: |
        UC04, US03, RG10. Enregistre le consentement avec sa date et la version du texte affiché.
        L'API crée en même temps un profil de santé vide, que l'app remplit ensuite.
        Un seul consentement actif par utilisateur : 409 s'il en existe déjà un.
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GrantHealthConsentRequest' }
            example: { textVersion: 2026-11-v1, accepted: true }
      responses:
        '201':
          description: Consentement enregistré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthConsentResponse' }
              example:
                id: 9a7c1d2e-4b3f-4c8a-8e1d-2f3a4b5c6d7e
                textVersion: 2026-11-v1
                grantedAt: '2026-11-27T09:20:00Z'
                withdrawnAt: null
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appios/health-consents/withdraw:
    patch:
      tags: [Consentement santé]
      operationId: withdrawHealthConsent
      summary: Retirer son consentement santé
      description: |
        UC28, US05, RG11. Dans une transaction, l'API renseigne `withdrawnAt` puis efface :
        le profil de santé et ses allergènes, les pesées, les séances et l'énergie active importées de Santé,
        les kcal estimées des séances (qui passent à `unknown`), et les versions calculées de l'historique
        des objectifs (RG52). L'objectif calorique passe en mode `manual`, avec la dernière valeur calculée
        ramenée entre 1 200 et 6 000 kcal. Repas, favoris, aliments personnalisés, séances saisies et
        objectifs d'activité sont gardés. 409 s'il n'y a pas de consentement actif.
      x-role: user
      responses:
        '200':
          description: Consentement retiré, avec le décompte de ce qui a été effacé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WithdrawHealthConsentResponse' }
              example:
                consent:
                  id: 9a7c1d2e-4b3f-4c8a-8e1d-2f3a4b5c6d7e
                  textVersion: 2026-11-v1
                  grantedAt: '2026-11-27T09:20:00Z'
                  withdrawnAt: '2026-12-02T18:40:00Z'
                erased:
                  healthProfile: true
                  weighIns: 6
                  importedActivities: 11
                  activeEnergyDays: 35
                  estimatedKcalCleared: 9
                  computedTargetVersions: 4
                calorieGoalMode: manual
                manualKcal: 2640
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Profil de santé

  /appios/health-profile:
    get:
      tags: [Profil de santé]
      operationId: showHealthProfile
      summary: Lire son profil de santé
      description: |
        UC05, US04, RG10. Renvoie les mensurations, l'orientation, les régimes et les allergènes déclarés,
        avec le poids de la dernière pesée (RG39, le poids n'est pas stocké à part).
        `isComplete` indique si l'objectif peut être calculé (RG34). 409 sans consentement actif.
      x-role: user
      responses:
        '200':
          description: Profil de santé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthProfileResponse' }
              example:
                id: 0c4e2a1b-9d8f-4e7a-b6c5-1a2b3c4d5e6f
                birthYear: 1990
                sex: male
                heightCm: 180
                activityLevel: moderate
                goalOrientation: maintain
                meatPreference: halal
                isVegetarian: false
                isVegan: false
                allergens:
                  - id: 6f533ee4-c33e-5487-b5ca-84b3070fc3e6
                    code: oeufs
                    nameFr: Œufs
                    nameEn: Eggs
                currentWeightKg: 70.00
                currentWeightOn: '2026-11-27'
                isComplete: true
                ageOutsideFormulaRange: false
                updatedAt: '2026-11-27T09:25:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      tags: [Profil de santé]
      operationId: updateHealthProfile
      summary: Mettre à jour son profil de santé, ses régimes et ses allergènes
      description: |
        UC03, UC05, US03, US04. Champs absents : inchangés ; `null` efface une valeur facultative.
        `allergenIDs`, s'il est présent, remplace toute la liste des allergènes déclarés (RG17).
        Contrôles sur l'état final :
        - année de naissance d'au moins 1900, donnant 18 ans ou plus cette année (RG12) ;
        - taille de 100 à 250 cm (RG13), listes fermées (RG13 à RG16) ;
        - végan implique végétarien ; un végétarien n'a pas de préférence de viande :
          passer `isVegetarian` à vrai efface `meatPreference`, et envoyer les deux ensemble donne 400 (RG16).

        Effet : en mode `computed`, l'objectif calorique est recalculé, et une version datée est enregistrée
        si la cible change (RG34, RG52). 409 sans consentement actif.
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateHealthProfileRequest' }
            example:
              birthYear: 1990
              sex: male
              heightCm: 180
              activityLevel: moderate
              goalOrientation: maintain
              meatPreference: halal
              isVegetarian: false
              isVegan: false
              allergenIDs: [6f533ee4-c33e-5487-b5ca-84b3070fc3e6]
      responses:
        '200':
          description: Profil de santé mis à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthProfileResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Référentiels

  /appios/allergens:
    get:
      tags: [Référentiels]
      operationId: listAllergens
      summary: Lister les 14 allergènes réglementaires
      description: UC05, UC12, RG17, RG21, RG49. Liste du règlement UE 1169/2011, annexe II, triée par nom.
      x-role: user
      responses:
        '200':
          description: Allergènes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Allergen' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /appios/food-groups:
    get:
      tags: [Référentiels]
      operationId: listFoodGroups
      summary: Lister les groupes d'aliments de CIQUAL
      description: UC12, UC13, UC34, RG19, RG49. Catégories des aliments (p. 22 du cahier), triées par code CIQUAL.
      x-role: user
      responses:
        '200':
          description: Groupes d'aliments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FoodGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /appios/activity-categories:
    get:
      tags: [Référentiels]
      operationId: listActivityCategories
      summary: Lister les catégories d'activité avec leurs types
      description: |
        UC08, RG29. Chaque catégorie contient ses types d'activité non archivés, avec leur MET,
        leur difficulté, leurs instructions et leurs groupes musculaires. Sert au choix groupé par catégorie (US08).
      x-role: user
      responses:
        '200':
          description: Catégories et types.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityCategoryWithTypes' }
              example:
                - id: 1f6cee16-4920-5f23-951c-4c7c63e3baab
                  code: walking
                  nameFr: Marche
                  nameEn: Walking
                  activityTypes:
                    - id: 893c01da-fca5-5b1d-a946-2c33283443ba
                      compendiumCode: '17200'
                      nameFr: Marche rapide
                      nameEn: Brisk walk
                      met: 4.8
                      difficulty: moderate
                      instructionsFr: null
                      instructionsEn: null
                      isArchived: false
                      activityCategoryID: 1f6cee16-4920-5f23-951c-4c7c63e3baab
                      muscleGroups:
                        - id: 0d59c099-4ec4-5687-8b67-52519c0cc1e8
                          code: legs
                          nameFr: Jambes
                          nameEn: Legs
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /appios/activity-types:
    get:
      tags: [Référentiels]
      operationId: listActivityTypes
      summary: Lister les types d'activité
      description: |
        UC08, UC10, RG29. Types non archivés, avec leur catégorie et leurs groupes musculaires.
        Filtre facultatif par catégorie. Tri par catégorie puis par nom dans la langue `lang`.
      x-role: user
      parameters:
        - name: activityCategoryID
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Types d'activité.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
