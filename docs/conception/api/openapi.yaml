        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Back-office : statistiques et journal

  /backoffice/stats:
    get:
      tags: [Back-office statistiques]
      operationId: showGlobalStats
      summary: Lire le tableau de bord global
      description: |
        UC36, US33, RG45, RG47, RG52, RG53. Agrégats seulement, calculés en SQL écrit à la main, sur la plage
        `from` à `to` (jours UTC, 366 jours au plus), découpée selon `granularity` pour les séries.
        - Inscrits (total, nouveaux, par statut), utilisateurs actifs (au moins une connexion dans la plage) et
          fréquence des connexions (RG53).
        - Repas par type et séances par catégorie, en volume et en minutes. Les repas sont datés par `eaten_on`
          et les séances par `performed_on` (jours locaux figés de chaque utilisateur, RG38).
        - Objectifs : modes de l'objectif calorique, part des objectifs d'activité atteints, part des jours saisis
          où la cible calorique du jour (version RG52) n'est pas dépassée.
        - Répartitions par tranche d'âge, sexe et orientation, comptées sur les comptes avec consentement actif,
          à l'instant de la requête. L'âge vaut l'année en cours moins l'année de naissance (`02-formules.md` §1).
          Trois tranches, toujours renvoyées dans cet ordre : `18-29`, `30-44` et `45+` (45 ans ou plus).
          Chaque répartition renvoie tous ses groupes, même vides.
        - Masquage (RG47) : un groupe vide (0) est affiché, il ne désigne personne. Un groupe de 1 à 4 personnes
          est masqué (`count = null`, `masked = true`). Si un seul groupe est masqué, le plus petit des autres
          groupes non vides l'est aussi, pour qu'on ne le déduise pas par soustraction du total. Une répartition
          dont le total est sous 5 est masquée entièrement (`total = null`, `masked = true`).
        - Limite : avec peu de comptes, comparer deux appels faits avant et après le consentement d'une personne
          permet de déduire ses valeurs (attaque par différence). Le masquage ne l'empêche pas ; voir `05-contrat-api.md`.
        Aucune donnée individuelle ne sort (RG45).
      x-role: admin
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: granularity
          in: query
          schema: { type: string, enum: [day, week, month], default: week }
      responses:
        '200':
          description: Statistiques globales.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStatsResponse' }
              example:
