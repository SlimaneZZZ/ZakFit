  # ---------------------------------------------------------------- Repas

  /appios/meals:
    get:
      tags: [Repas]
      operationId: listMeals
      summary: Lister ses repas d'un jour ou d'une plage
      description: |
        UC18, US15, RG23, RG26. Donner soit `date`, soit `from` et `to` (plage de 366 jours au plus,
        `to` jamais avant `from`) ; sans aucun des deux, le jour courant dans le fuseau du profil.
        Les repas sont groupés par jour puis triés par type (petit-déjeuner, déjeuner, dîner, collation).
        - Filtres : `mealType`, et seuil sur le total du repas avec `minKcal` et `maxKcal`
          (par exemple « plus de 500 kcal », p. 13).
        - Chaque repas porte ses lignes et son total ; chaque jour porte le total des repas renvoyés,
          qui est le total du jour quand aucun filtre n'est appliqué (RG26). Les totaux sont calculés par l'API.
        - Pas de pagination : la réponse est bornée par la plage.
      x-role: user
      parameters:
        - $ref: '#/components/parameters/Date'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: mealType
          in: query
          schema: { $ref: '#/components/schemas/MealType' }
        - name: minKcal
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxKcal
          in: query
          schema: { type: number, minimum: 0 }
      responses:
        '200':
          description: Repas groupés par jour, avec les totaux.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MealDaysResponse' }
              example:
                from: '2026-11-27'
                to: '2026-11-27'
                days:
                  - date: '2026-11-27'
                    meals:
                      - id: 7b1e9c2d-3f4a-4b5c-8d6e-7f8a9b0c1d2e
                        mealType: breakfast
                        eatenOn: '2026-11-27'
                        origin: manual
                        items:
                          - id: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
                            foodID: f3341a55-848d-579a-babf-d98c9f06b7e5
                            foodNameFr: Oeuf cru
                            foodNameEn: Egg, raw
                            foodIsArchived: false
                            quantityG: 100
                            foodPortionID: 8d3ebf82-ebe3-5afd-96cb-8d72a4300c5b
                            portionLabelFr: 1 œuf moyen (calibre US « large »)
                            portionLabelEn: 1 medium egg (US large)
                            portionCount: 2
                            kcal: 140.00
                            proteinG: 12.80
                            carbsG: 0.06
                            fatG: 9.83
                            estimatedG: null
                        totals: { kcal: 140.00, proteinG: 12.80, carbsG: 0.06, fatG: 9.83 }
                        createdAt: '2026-11-27T07:45:00Z'
                        updatedAt: '2026-11-27T07:45:00Z'
                    totals: { kcal: 140.00, proteinG: 12.80, carbsG: 0.06, fatG: 9.83 }
                totals: { kcal: 140.00, proteinG: 12.80, carbsG: 0.06, fatG: 9.83 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Repas]
      operationId: createMeal
      summary: Ajouter un repas, à la main, depuis un favori ou depuis une photo
      description: |
        UC14, UC15, UC16, US13, US14, US17, RG19, RG20, RG23, RG24, RG25, RG27, RG28.
        Le client n'envoie que le type, le jour, l'origine et les lignes (aliment, quantité, unité) ;
        l'API ignore toute valeur nutritionnelle et calcule chaque ligne : valeur pour 100 g × grammes / 100,
        valeurs figées à l'enregistrement (RG24, RG25).
        - Jour local, pas dans le futur (RG23). Au moins une ligne (RG24).
        - Chaque ligne donne soit `quantityG` (1 à 5 000 g), soit `foodPortionID` et `portionCount` ;
          l'API calcule alors les grammes (unités × poids de l'unité), qui doivent rester entre 1 et 5 000 (RG20).
          L'unité doit appartenir à l'aliment de la ligne.
        - L'aliment est un aliment de base ou un aliment personnalisé de l'utilisateur ; sinon 404 (RG19).
          Un aliment archivé ne s'ajoute plus : 409.
        - `origin = favorite` : l'app a prérempli le repas depuis un favori (GET du favori), puis l'utilisateur
          l'a modifié ; le repas est recalculé avec les valeurs actuelles (RG27).
        - `origin = photo` : chaque ligne peut porter `estimatedG`, les grammes proposés par le modèle
          d'Apple avant correction (RG28). `estimatedG` est refusé pour une autre origine. La photo n'est
          jamais envoyée.
        - Réponse : le repas, ses lignes et son total (p. 13).
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMealRequest' }
            examples:
              manuel:
                summary: Déjeuner saisi en grammes
                value:
                  mealType: lunch
                  eatenOn: '2026-11-27'
                  origin: manual
                  items:
                    - foodID: 1574251b-58e4-5550-8303-43da54e6be07
                      quantityG: 150
                    - foodID: bb59e421-6784-57cb-9c15-ad0de0d7b5d5
                      quantityG: 200
              unites:
                summary: Petit-déjeuner saisi en unités
                value:
                  mealType: breakfast
                  eatenOn: '2026-11-27'
                  origin: manual
                  items:
                    - foodID: f3341a55-848d-579a-babf-d98c9f06b7e5
                      foodPortionID: 8d3ebf82-ebe3-5afd-96cb-8d72a4300c5b
                      portionCount: 2
              photo:
                summary: Repas validé après l'analyse d'une photo
                value:
                  mealType: dinner
                  eatenOn: '2026-11-27'
                  origin: photo
                  items:
                    - foodID: 1574251b-58e4-5550-8303-43da54e6be07
                      quantityG: 140
                      estimatedG: 120
                    - foodID: bb59e421-6784-57cb-9c15-ad0de0d7b5d5
                      quantityG: 180
                      estimatedG: 180
      responses:
        '201':
          description: Repas créé, avec ses valeurs calculées.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meal' }
              example:
                id: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
                mealType: lunch
                eatenOn: '2026-11-27'
                origin: manual
                items:
                  - id: 3d4e5f6a-7b8c-4d9e-8f0a-1b2c3d4e5f6a
                    foodID: 1574251b-58e4-5550-8303-43da54e6be07
                    foodNameFr: Poulet, viande et peau rôties/cuites au four
                    foodNameEn: Chicken, meat and skin, roasted/baked
                    foodIsArchived: false
                    quantityG: 150
                    foodPortionID: null
                    portionLabelFr: null
                    portionLabelEn: null
                    portionCount: null
                    kcal: 306.00
                    proteinG: 43.35
                    carbsG: 0.00
                    fatG: 14.82
                    estimatedG: null
                  - id: 4e5f6a7b-8c9d-4e0f-9a1b-2c3d4e5f6a7b
                    foodID: bb59e421-6784-57cb-9c15-ad0de0d7b5d5
                    foodNameFr: Riz blanc, cuit, sans sel ajouté
                    foodNameEn: Rice, white, cooked, no added salt
                    foodIsArchived: false
                    quantityG: 200
                    foodPortionID: null
