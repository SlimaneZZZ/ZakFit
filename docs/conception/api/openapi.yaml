  # ---------------------------------------------------------------- Objectifs

  /appios/calorie-goal:
    get:
      tags: [Objectifs]
      operationId: showCalorieGoal
      summary: Lire son objectif calorique, avec la cible effective
      description: |
        UC20, US18, RG34, RG35, RG36. La cible effective `effectiveKcal` vaut `manualKcal` en mode `manual`,
        ou le résultat de la formule en mode `computed` (Mifflin-St Jeor × PAL, ajusté par l'orientation,
        jamais sous la dépense de repos ni sous 1 200 kcal, jamais au-dessus de 6 000, arrondi à la dizaine
        supérieure, `02-formules.md` §1 à §3). En mode `computed`, `computation` détaille le calcul.
        `warnings` porte les avertissements à afficher sans refuser (RG35, RG36, RG12).
        404 tant qu'aucun objectif n'est défini (avant la fin du questionnaire).
      x-role: user
      responses:
        '200':
          description: Objectif calorique.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalorieGoalResponse' }
              example:
                id: b2c3d4e5-f6a7-4b8c-9d0e-1f2a3b4c5d6e
                mode: computed
                manualKcal: null
                effectiveKcal: 2640
                computation:
                  restingKcal: 1650
                  pal: 1.6
                  totalKcal: 2640
                  orientationAdjustmentKcal: 0
                  floorApplied: false
                  ceilingApplied: false
                proteinGTarget: 99
                carbsGTarget: 317
                fatGTarget: 109
                macrosCustom: false
                warnings: []
                updatedAt: '2026-11-27T09:30:00Z'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Objectifs]
      operationId: saveCalorieGoal
      summary: Définir ou modifier le mode, la valeur saisie et les macros
      description: |
        UC20, US18, RG34, RG35, RG36, RG52. Crée l'objectif à la fin du questionnaire, puis le modifie.
        - `mode = computed` : exige un consentement actif, un profil de santé complet et au moins une pesée (409 sinon).
        - `mode = manual` : `manualKcal` obligatoire, de 1 200 à 6 000 kcal (400 sinon). Une valeur sous la
          dépense de repos donne l'avertissement `below_resting_energy`, si elle est calculable (RG35).
        - `macrosCustom = false` : l'API calcule les grammes avec la répartition de l'ANSES
          (15 % protéines, 48 % glucides, 37 % lipides) et les recalcule quand la cible change (RG36).
        - `macrosCustom = true` : les trois grammes sont obligatoires (0 à 1 000) et ne bougent plus ;
          un écart de plus de 10 % entre 4 P + 4 G + 9 L et la cible donne l'avertissement `macros_energy_mismatch`.
        - Si la cible effective ou les macros changent, l'API enregistre une version datée du jour local (RG52),
          qui remplace une version déjà créée le même jour.
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveCalorieGoalRequest' }
            examples:
              calcule:
                summary: Objectif calculé, macros proposées
                value: { mode: computed, manualKcal: null, macrosCustom: false }
              saisi:
                summary: Objectif saisi, macros personnalisées
                value:
                  mode: manual
                  manualKcal: 2400
                  macrosCustom: true
                  proteinGTarget: 140
                  carbsGTarget: 260
                  fatGTarget: 85
      responses:
        '200':
          description: Objectif enregistré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CalorieGoalResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appios/calorie-goal/history:
    get:
      tags: [Objectifs]
      operationId: listCalorieTargetHistory
      summary: Lire l'historique des versions de l'objectif calorique
      description: |
        UC20, UC24, RG52, RG11. Versions datées et figées, de la plus récente à la plus ancienne. Une version s'applique de
        `effectiveFrom` jusqu'à la veille de la version suivante. Filtre facultatif sur la plage.
        Les versions calculées sont effacées au retrait du consentement (RG11).
      x-role: user
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Versions.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CalorieTargetVersion' }
              example:
                - id: c3d4e5f6-a7b8-4c9d-8e0f-1a2b3c4d5e6f
                  effectiveFrom: '2026-11-27'
                  kcalTarget: 2640
                  proteinGTarget: 99
                  carbsGTarget: 317
                  fatGTarget: 109
                  mode: computed
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /appios/activity-goals:
    get:
      tags: [Objectifs]
      operationId: listActivityGoals
      summary: Lister ses objectifs d'activité
      description: |
        UC21, US19, RG37. Par défaut les objectifs en cours (`validTo` vide) ; `includeClosed=true` ajoute
        les versions closes, pour comparer un bilan passé à l'objectif qui s'appliquait ce jour-là.
      x-role: user
      parameters:
        - name: includeClosed
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Objectifs d'activité.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ActivityGoal' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Objectifs]
      operationId: createActivityGoal
      summary: Créer un objectif d'activité
      description: |
        UC21, US19, RG37. Métrique (`sessions`, `minutes`, `kcal`), période (`day`, `week`, ou `session` pour
        `kcal` seulement), catégorie facultative (vide pour toutes), valeur entière strictement positive.
        `validFrom` vaut le jour local courant. Un seul objectif en cours par trio métrique, période, catégorie : 409.
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActivityGoalRequest' }
            example:
              metric: minutes
              period: week
              activityCategoryID: 7317bfcb-58f7-5ef7-b745-501168b0fe66
              targetValue: 150
      responses:
        '201':
          description: Objectif créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityGoal' }
              example:
                id: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f7a
                metric: minutes
                period: week
                activityCategoryID: 7317bfcb-58f7-5ef7-b745-501168b0fe66
                activityCategoryCode: cardio
                targetValue: 150
                validFrom: '2026-11-23'
                validTo: null
                createdAt: '2026-11-23T08:00:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appios/activity-goals/{activityGoalID}:
    parameters:
      - $ref: '#/components/parameters/ActivityGoalID'
    patch:
      tags: [Objectifs]
      operationId: updateActivityGoal
      summary: Modifier la valeur d'un objectif d'activité (nouvelle version)
      description: |
        UC21, RG37. Seule `targetValue` se modifie ; changer la métrique, la période ou la catégorie,
        c'est supprimer l'objectif et en créer un autre. L'API clôt la ligne en cours (`validTo` = veille du jour
        local) et crée une nouvelle ligne à partir du jour local, renvoyée en réponse. Si la ligne en cours a
        commencé le jour même, elle est modifiée sur place. Un objectif déjà clos : 409.
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateActivityGoalRequest' }
            example: { targetValue: 180 }
      responses:
        '200':
          description: Nouvelle version de l'objectif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityGoal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Objectifs]
      operationId: deleteActivityGoal
      summary: Supprimer un objectif d'activité
      description: |
        UC21, RG37. L'objectif en cours est clos (`validTo` = veille du jour local), pour que les bilans passés
        gardent leur référence. S'il a commencé le jour même, la ligne est supprimée. Un objectif déjà clos : 409.
      x-role: user
      responses:
        '204': { description: "Objectif clos ou supprimé." }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Tableau de bord

  /appios/dashboard:
    get:
      tags: [Tableau de bord]
      operationId: showDashboard
      summary: Lire le tableau de bord d'un jour
      description: |
        UC23, US21, RG26, RG31, RG38, RG40, RG41, RG52. Tout l'écran en un seul appel, pour le jour local `date`
        (aujourd'hui par défaut, pas dans le futur). Rien n'est stocké : tout est calculé à la demande.
        - `consumed` : total des repas du jour (RG26). `calorieTarget` : version de l'objectif qui s'applique
          ce jour-là (RG52), ou `null`.
        - `burned` : somme des kcal des séances dont `performed_on` vaut ce jour, saisies ou importées, hors séances
          non renseignées ;
          `incomplete` est vrai si une séance du jour est non renseignée (RG31, RG40).
        - `activeEnergyKcal` : énergie active de Santé, affichée à part et hors calcul (RG40).
        - `activityGoals` : progression de chaque objectif d'activité valable ce jour-là, sur sa période (jour,
          semaine ISO du lundi au dimanche dans le fuseau du profil, ou meilleure séance du jour pour `session`) (RG37, RG38).
        - `alerts` et `recommendations` (RG41) : objectif calorique dépassé ; macro sous 80 % de son objectif à
          partir de 18 h locale, ou au-delà de 110 % ; « il te manque X g » pour une macro sous son objectif à
          partir de 18 h ; suggestion d'activité pour un objectif de la semaine, avec l'activité la plus pratiquée
          (marche rapide sans historique) et la formule MET. Sans poids connu, la suggestion est en minutes
          seulement, et seulement pour les objectifs en minutes ou en séances. Pour un objectif en séances, la suggestion
          est une séance de la durée moyenne de l'activité suggérée (30 minutes sans historique). Pour un jour passé, l'heure est
          considérée comme passée.
        - Les alertes portent des codes et des valeurs : l'app compose le texte dans la langue de l'appareil (RG49).
      x-role: user
      parameters:
        - $ref: '#/components/parameters/Date'
      responses:
        '200':
          description: Tableau de bord.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
              example:
                date: '2026-11-27'
                generatedAt: '2026-11-27T19:00:00Z'
                consumed: { kcal: 756.00, proteinG: 62.77, carbsG: 66.46, fatG: 26.05 }
                mealsCount: 2
                calorieTarget:
                  kcalTarget: 2640
                  proteinGTarget: 99
                  carbsGTarget: 317
                  fatGTarget: 109
                  mode: computed
                  effectiveFrom: '2026-11-27'
                balanceKcal: -1884.00
                macros:
                  - { macro: protein, consumedG: 62.77, targetG: 99, percent: 63.4 }
                  - { macro: carbs, consumedG: 66.46, targetG: 317, percent: 21.0 }
                  - { macro: fat, consumedG: 26.05, targetG: 109, percent: 23.9 }
                burned: { kcal: 290.50, sessions: 1, minutes: 30, incomplete: false }
                activeEnergyKcal: 512.40
                weekMinutes: 75
                activityGoals:
                  - activityGoalID: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f7a
                    metric: minutes
                    period: week
                    activityCategoryID: 7317bfcb-58f7-5ef7-b745-501168b0fe66
                    targetValue: 150
                    periodStart: '2026-11-23'
                    periodEnd: '2026-11-29'
                    achievedValue: 75
                    percent: 50.0
                    reached: false
                alerts:
                  - { code: macro_low, macro: protein, percent: 63.4, excessKcal: null }
                  - { code: macro_low, macro: carbs, percent: 21.0, excessKcal: null }
                  - { code: macro_low, macro: fat, percent: 23.9, excessKcal: null }
                recommendations:
                  - code: macro_missing
                    macro: protein
                    missingG: 36.23
                    activityGoalID: null
                    activityTypeID: null
                    minutes: null
                    kcal: null
                  - code: activity_suggestion
                    macro: null
                    missingG: null
                    activityGoalID: d4e5f6a7-b8c9-4d0e-9f1a-2b3c4d5e6f7a
                    activityTypeID: 6e837b79-6e8c-561b-b010-d6c0967218d1
                    minutes: 75
                    kcal: 726.25
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Historique

  /appios/history:
    get:
      tags: [Historique]
      operationId: listHistorySummary
      summary: Lire les résumés par jour, par semaine ou par mois
      description: |
        UC24, US22, RG26, RG31, RG38, RG40, RG52. Plage `from` à `to` obligatoire (366 jours au plus ;
        une fin avant le début donne 400), découpée selon `groupBy` :
        `day` pour la vue semaine jour par jour, `week` (lundi au dimanche) ou `month` (mois civil)
        pour la vue mois, dans le fuseau du profil (RG38).
        Les repas sont rangés par `eaten_on` et les séances par `performed_on`, jours locaux figés (RG38).
        Chaque période donne les kcal consommées et brûlées, les macros, les séances, les minutes, les repas,
        et la somme des cibles caloriques des jours qui en ont une, prise dans la version qui s'appliquait
        chaque jour (RG52). Calcul en SQL écrit à la main (voir `05-contrat-api.md`).
      x-role: user
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: groupBy
          in: query
          required: true
          schema: { type: string, enum: [day, week, month] }
      responses:
        '200':
          description: Résumés.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistorySummaryResponse' }
              example:
                from: '2026-11-16'
                to: '2026-11-29'
                groupBy: week
                periods:
