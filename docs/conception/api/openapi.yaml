  # ---------------------------------------------------------------- Activités

  /appios/activities:
    get:
      tags: [Activités]
      operationId: listActivities
      summary: Lister, filtrer et trier ses séances
      description: |
        UC10, US09, RG31, RG32, RG38. Filtrage et tri faits par l'API, qui ne renvoie que la page demandée (p. 9).
        - Filtres combinables : `activityTypeID` ou `activityCategoryID`, `minDuration` (minutes),
          `from` et `to` (jours locaux inclus, comparés à `performed_on` ; une semaine ou un mois se demande
          par sa plage, RG38).
        - Tris : `date_desc` (par défaut), `date_asc`, `type` (nom du type dans la langue `lang`, puis date
          décroissante), `duration` (durée décroissante, puis date décroissante).
        - Les séances importées que l'utilisateur a supprimées (`is_ignored`) ne sont jamais renvoyées (RG33).
        - `performedOn` est le jour local figé de la séance (voir le schéma `Activity`).
        - Une séance aux calories non renseignées a `kcal = null` et `kcalStatus = unknown` (RG31).
      x-role: user
      parameters:
        - name: activityTypeID
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: activityCategoryID
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: minDuration
          in: query
          description: Durée minimale en minutes.
          schema: { type: integer, minimum: 1, maximum: 600 }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: sort
          in: query
          schema: { $ref: '#/components/schemas/ActivitySort' }
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Per'
      responses:
        '200':
          description: Page de séances.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
              example:
                items:
                  - id: 9d0e1f2a-3b4c-4d5e-8f6a-7b8c9d0e1f2a
                    performedAt: '2026-11-27T06:30:00Z'
                    performedOn: '2026-11-27'
                    durationMin: 30
                    kcal: 290.50
                    kcalStatus: estimated
                    source: manual
                    healthUUID: null
                    activityTypeID: 6e837b79-6e8c-561b-b010-d6c0967218d1
                    activityTypeNameFr: Course modérée (~10 km/h)
                    activityTypeNameEn: Moderate run (~10 km/h)
                    activityCategoryID: 7317bfcb-58f7-5ef7-b745-501168b0fe66
                    activityCategoryCode: cardio
                    createdAt: '2026-11-27T07:05:00Z'
                    updatedAt: '2026-11-27T07:05:00Z'
                metadata: { page: 1, per: 10, total: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Activités]
      operationId: createActivity
      summary: Ajouter une séance
      description: |
        UC08, UC09, US08, RG29, RG30, RG31, RG33.
        - Type pris dans le référentiel, non archivé (404 s'il n'existe pas, 409 s'il est archivé) (RG29).
        - Durée entière de 1 à 600 minutes ; début de séance pas dans le futur (RG30).
        - L'API calcule et fige `performed_on`, le jour local de `performedAt` dans le fuseau du profil (RG38).
          Le client ne l'envoie pas.
        - `kcal` facultatif, de 0 à 5 000. Vide : l'API estime avec (MET − 1) × dernier poids × heures si le
          consentement est actif et qu'une pesée existe (`estimated`), sinon `unknown` (RG31, `02-formules.md` §6).
        - `healthUUID` facultatif : identifiant de l'objet que ZakFit a écrit dans Santé, pour ne jamais
          le réimporter (RG33). La séance garde `source = manual`.
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateActivityRequest' }
            example:
              activityTypeID: 6e837b79-6e8c-561b-b010-d6c0967218d1
              performedAt: '2026-11-27T06:30:00Z'
              durationMin: 30
              kcal: null
              healthUUID: null
      responses:
        '201':
          description: Séance créée. Ici, kcal estimées pour 70 kg, (9,3 − 1) × 70 × 0,5 = 290,5.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
              example:
                id: 9d0e1f2a-3b4c-4d5e-8f6a-7b8c9d0e1f2a
                performedAt: '2026-11-27T06:30:00Z'
                performedOn: '2026-11-27'
                durationMin: 30
                kcal: 290.50
                kcalStatus: estimated
                source: manual
                healthUUID: null
                activityTypeID: 6e837b79-6e8c-561b-b010-d6c0967218d1
                activityTypeNameFr: Course modérée (~10 km/h)
                activityTypeNameEn: Moderate run (~10 km/h)
                activityCategoryID: 7317bfcb-58f7-5ef7-b745-501168b0fe66
                activityCategoryCode: cardio
                createdAt: '2026-11-27T07:05:00Z'
                updatedAt: '2026-11-27T07:05:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appios/activities/estimate:
    post:
      tags: [Activités]
      operationId: estimateActivityKcal
      summary: Estimer les calories d'une séance avant de l'enregistrer
      description: |
        UC09, RG10, RG31. Calcule (MET − 1) × poids × durée en heures, avec le MET du type et le poids de la
        dernière pesée (`02-formules.md` §6). Rien n'est enregistré.
        Sans consentement actif ou sans pesée, la réponse vaut `kcal = null`, `kcalStatus = unknown`,
        avec la raison : l'estimation n'est pas proposée (RG10).
        `outsideFormulaAgeRange` signale un âge hors de 19 à 59 ans, pour la mention « estimé » de l'app (RG12).
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EstimateActivityRequest' }
            example:
              activityTypeID: 6e837b79-6e8c-561b-b010-d6c0967218d1
              durationMin: 30
      responses:
        '200':
          description: Estimation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityEstimateResponse' }
              example:
                kcal: 290.50
                kcalStatus: estimated
                met: 9.3
                weightKg: 70.00
                durationMin: 30
                unavailableReason: null
                outsideFormulaAgeRange: false
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /appios/activities/import:
    post:
      tags: [Activités]
      operationId: importHealthActivities
      summary: Importer un lot de séances depuis Santé
      description: |
        UC26, US24, RG10, RG30, RG31, RG33. Exige un consentement actif (409 sinon) ; 500 séances au plus par lot.
        Pour chaque séance du lot, dans l'ordre :
        1. `healthUUID` déjà présent chez l'utilisateur sur une séance écrite par ZakFit (`source = manual`) :
           écartée (`skippedOwnSource`), ZakFit ne réimporte pas ce qu'il a écrit ;
        2. déjà importée et ignorée (supprimée par l'utilisateur) : écartée (`skippedIgnored`) ;
        3. déjà importée : écartée (`skippedDuplicates`), sans doublon grâce à l'index unique (id_user, health_uuid) ;
        4. `healthWorkoutType` absent de la table de correspondance de l'API : écartée (`skippedUnmapped`) ;
        5. durée hors de 1 à 600 minutes ou date future : refusée, avec sa raison (`rejected`) ;
        6. sinon importée avec `source = health` et `performed_on` calculé dans le fuseau du profil (RG38) ;
           sans kcal, estimées comme à la saisie (RG31).

        Un élément invalide ne fait pas échouer le lot. La réponse donne le nombre de séances écartées, que l'app affiche.
        Double contrôle de la source (RG33, RG40) : l'app n'envoie pas les séances dont la source est ZakFit
        (`HKSource.default()`), comme pour l'énergie active. Ainsi, une séance écrite dans Santé dont le `healthUUID`
        n'a pas pu être enregistré ne revient pas en double.
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportHealthActivitiesRequest' }
            example:
              workouts:
                - healthUUID: 0f9e8d7c-6b5a-4493-8271-605f4e3d2c1b
                  healthWorkoutType: running
                  performedAt: '2026-11-25T17:10:00Z'
                  durationMin: 42
                  kcal: 401.2
                - healthUUID: 1e2d3c4b-5a69-4788-9766-5544332211aa
                  healthWorkoutType: golf
                  performedAt: '2026-11-26T09:00:00Z'
                  durationMin: 120
                  kcal: 380
      responses:
        '200':
          description: Résultat de l'import.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityImportResult' }
              example:
                received: 2
                imported: 1
                skippedDuplicates: 0
                skippedIgnored: 0
                skippedOwnSource: 0
                skippedUnmapped: 1
                rejected: []
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appios/activities/{activityID}:
    parameters:
      - $ref: '#/components/parameters/ActivityID'
    get:
      tags: [Activités]
      operationId: showActivity
      summary: Lire une séance
      description: UC10, UC11, RG09. Une séance d'un autre utilisateur, ou ignorée, répond 404.
      x-role: user
      responses:
        '200':
          description: Séance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Activités]
      operationId: updateActivity
      summary: Modifier une séance
      description: |
        UC11, US10, RG29, RG30, RG31, RG38. Champs absents : inchangés. Les contrôles de RG30 sont rejoués.
        Si `performedAt` change, l'API recalcule `performed_on` dans le fuseau actuel du profil.
        - `kcal` avec une valeur : calories saisies (`entered`).
        - `kcal: null` explicite : l'API estime de nouveau, ou passe à `unknown` (RG31).
        - Si le type ou la durée change et que les calories étaient estimées, elles sont estimées de nouveau.
        - `healthUUID` permet d'enregistrer l'identifiant de l'objet écrit dans Santé après coup (RG33).
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateActivityRequest' }
            example: { durationMin: 35 }
      responses:
        '200':
          description: Séance modifiée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Activity' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Activités]
      operationId: deleteActivity
      summary: Supprimer une séance
      description: |
        UC11, US10, RG33. Une séance saisie est supprimée. Une séance importée de Santé n'est pas effacée de
        Santé : elle est marquée ignorée (`is_ignored`), ses kcal sont effacées (minimisation), et elle n'est
        plus jamais renvoyée ni réimportée. Dans les deux cas la réponse est 204.
      x-role: user
      responses:
        '204': { description: "Séance supprimée ou ignorée." }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Pesées

  /appios/weigh-ins:
    get:
      tags: [Pesées]
      operationId: listWeighIns
      summary: Lister ses pesées pour la courbe
      description: |
        UC22, UC29, US20, RG39. Pesées de la plage, par date croissante ; sans plage, les 30 derniers jours.
        Les pesées importées que l'utilisateur a supprimées (`is_ignored`) ne sont jamais renvoyées.
        La courbe de l'app demande 1 mois, 3 mois ou 1 an (366 jours au plus). 409 sans consentement actif.
      x-role: user
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
      responses:
        '200':
          description: Pesées.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WeighIn' }
              example:
                - id: a1b2c3d4-e5f6-4a7b-8c9d-0e1f2a3b4c5d
                  weighedOn: '2026-11-27'
                  weightKg: 70.00
                  source: manual
                  healthUUID: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
                  createdAt: '2026-11-27T06:10:00Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    post:
      tags: [Pesées]
      operationId: createWeighIn
      summary: Enregistrer une pesée
      description: |
        UC22, US20, RG10, RG13, RG34, RG39, RG52. Poids de 30 à 300 kg, jour local pas dans le futur.
        Exige un consentement actif (409 sinon).
        - Une seule pesée par jour : s'il en existe déjà une ce jour-là, saisie ou importée, la réponse est 409,
          sauf si `replaceExisting = true` (l'utilisateur a confirmé) ; elle est alors remplacée (200).
          Une pesée importée ignorée ce jour-là ne compte pas : la saisie la remplace sans confirmation (201).
        - `healthUUID` facultatif : objet écrit par ZakFit dans Santé, pour ne pas le réimporter (RG33).
        - Effet : en mode `computed`, l'objectif calorique est recalculé et versionné (RG34, RG52) ;
          les kcal déjà estimées des séances passées ne changent pas.
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWeighInRequest' }
            example:
              weighedOn: '2026-11-27'
              weightKg: 70.0
              healthUUID: 2b3c4d5e-6f7a-4b8c-9d0e-1f2a3b4c5d6e
              replaceExisting: false
      responses:
        '200':
          description: Pesée du jour remplacée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeighIn' }
        '201':
          description: Pesée créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeighIn' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }

  /appios/weigh-ins/import:
    post:
      tags: [Pesées]
      operationId: importHealthWeighIns
      summary: Importer un lot de pesées depuis Santé
      description: |
        UC26, US24, RG10, RG13, RG33, RG39. Exige un consentement actif (409 sinon) ; 500 pesées au plus.
        L'app envoie au plus une pesée par jour, la dernière du jour dans Santé, sans les échantillons dont la
        source est ZakFit (`HKSource.default()`, RG33). Pour chacune :
        - `healthUUID` égal à celui d'une pesée écrite par ZakFit : écartée (`skippedOwnSource`) ;
        - jour dont la pesée importée a été supprimée par l'utilisateur (`is_ignored`) : écartée (`skippedIgnored`),
          elle ne revient pas (RG39) ;
        - jour qui a déjà une pesée saisie : écartée, la saisie l'emporte (`skippedManualSameDay`, RG39) ;
        - jour qui a déjà une pesée importée : mise à jour si l'identifiant ou le poids diffère (`updated`),
          sinon écartée (`skippedDuplicates`) ;
        - poids hors de 30 à 300 kg ou jour futur : refusée (`rejected`) ;
        - sinon importée (`source = health`).

        Effet : objectif recalculé et versionné en mode `computed` si la dernière pesée change (RG34, RG52).
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportHealthWeighInsRequest' }
            example:
              weighIns:
                - healthUUID: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
                  weighedOn: '2026-11-26'
                  weightKg: 70.4
      responses:
        '200':
          description: Résultat de l'import.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeighInImportResult' }
              example:
                received: 1
                imported: 1
                updated: 0
                skippedDuplicates: 0
                skippedIgnored: 0
                skippedManualSameDay: 0
                skippedOwnSource: 0
                rejected: []
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
