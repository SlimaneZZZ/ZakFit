              activityCategoryID: 9925fb05-fa9c-540e-8d18-5ca65c2d7599
              muscleGroupIDs: [bbafe7ce-9256-5628-82fa-a185ded75152, 5b97aa0d-8882-5b12-97b4-b72ba4fa51c1]
