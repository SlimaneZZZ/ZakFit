    patch:
      tags: [Back-office types d'activité]
      operationId: updateActivityType
      summary: Modifier ou désarchiver un type d'activité
      description: |
        UC35, US32, RG29, RG46, RG48. Noms, difficulté, instructions, catégorie, groupes musculaires
        (`muscleGroupIDs` remplace la liste) et archivage. Le MET et le code du Compendium ne se modifient
        jamais : les envoyer donne 400. Journalisé (`update`, ou `archive`).
      x-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateActivityTypeRequest' }
            example:
              difficulty: moderate
              instructionsFr: Garde le dos droit et respire régulièrement.
              muscleGroupIDs: [0d59c099-4ec4-5687-8b67-52519c0cc1e8, 7019d20d-2f31-5302-839c-9eb9b444e82d]
      responses:
        '200':
          description: Type modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityType' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Back-office types d'activité]
