  /appios/meals/{mealID}:
    parameters:
      - $ref: '#/components/parameters/MealID'
    get:
      tags: [Repas]
      operationId: showMeal
      summary: Lire un repas
      description: UC18, UC19, RG09, RG26. Le repas d'un autre utilisateur répond 404.
      x-role: user
      responses:
        '200':
          description: Repas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Repas]
      operationId: updateMeal
      summary: Modifier un repas
      description: |
        UC19, US16, RG23, RG24, RG25, RG26. Remplace le type, le jour et la liste complète des lignes.
        - Une ligne envoyée avec son `id`, au même aliment et à la même quantité, garde ses valeurs figées (RG25).
        - Une ligne avec `id` dont la quantité ou l'unité change est recalculée avec les valeurs actuelles de l'aliment.
        - Une ligne sans `id` est ajoutée et calculée ; une ligne existante absente de la liste est supprimée.
        - Une ligne avec `id` ne peut pas changer d'aliment (400) : on la retire et on en ajoute une.
        - L'origine du repas et les `estimatedG` des lignes conservées ne changent pas.
        - Aliment archivé depuis (RG22) : une ligne existante (avec `id`) reste acceptée, inchangée ou avec une
          nouvelle quantité, recalculée avec les valeurs actuelles de l'aliment ; seule une nouvelle ligne
          (sans `id`) sur un aliment archivé est refusée (409). Corriger un repas passé reste donc possible (US16).
        Les autres contrôles de création s'appliquent de nouveau.
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMealRequest' }
            example:
              mealType: lunch
              eatenOn: '2026-11-27'
              items:
                - id: 3d4e5f6a-7b8c-4d9e-8f0a-1b2c3d4e5f6a
                  foodID: 1574251b-58e4-5550-8303-43da54e6be07
                  quantityG: 120
                - foodID: 3b638026-41f1-5f4c-96b9-4dfd5b160d80
                  quantityG: 120
      responses:
        '200':
          description: Repas modifié.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Repas]
      operationId: deleteMeal
      summary: Supprimer un repas
      description: UC19, US16, RG09. Supprime le repas et ses lignes (cascade). La confirmation est faite par l'app.
      x-role: user
      responses:
        '204': { description: "Repas supprimé." }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

