                    periodEnd: '2026-11-22'
                    consumed: { kcal: 17850.00, proteinG: 702.40, carbsG: 2105.30, fatG: 690.10 }
                    burnedKcal: 1820.50
                    burnedIncomplete: false
                    sessions: 4
                    activityMinutes: 185
                    mealsCount: 24
                    daysLogged: 7
                    targetKcal: 18480
                    daysWithTarget: 7
                  - periodStart: '2026-11-23'
                    periodEnd: '2026-11-29'
                    consumed: { kcal: 9100.00, proteinG: 380.20, carbsG: 1040.70, fatG: 330.40 }
                    burnedKcal: 691.70
                    burnedIncomplete: true
                    sessions: 3
                    activityMinutes: 105
                    mealsCount: 13
                    daysLogged: 5
                    targetKcal: 13200
                    daysWithTarget: 5
                totals:
                  consumed: { kcal: 26950.00, proteinG: 1082.60, carbsG: 3146.00, fatG: 1020.50 }
                  burnedKcal: 2512.20
                  burnedIncomplete: true
                  sessions: 7
                  activityMinutes: 290
                  mealsCount: 37
                  daysLogged: 12
                  targetKcal: 31680
                  daysWithTarget: 12
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /appios/history/days/{date}:
