  # ---------------------------------------------------------------- Aliments

  /appios/foods:
    get:
      tags: [Aliments]
      operationId: searchFoods
      summary: Rechercher un aliment
      description: |
        UC12, US11, RG19, RG21, RG51. Recherche paginée parmi les aliments de base et les aliments
        personnalisés de l'utilisateur, hors aliments archivés (RG22, RG46).
        - `search` porte sur `nameFr` et `nameEn`, sans tenir compte de la casse ni des accents
          (collation `utf8mb4_unicode_ci`), avec 2 caractères au moins. Sans `search`, la liste est alphabétique.
        - Tri : les noms qui commencent par le texte d'abord, puis l'ordre alphabétique dans la langue `lang`.
        - Chaque résultat porte ses valeurs pour 100 g et son étiquette de compatibilité, calculée pour
          l'utilisateur à partir de son profil de santé (régimes, préférence de viande, allergènes déclarés).
        - Les aliments incompatibles sont exclus par défaut ; `includeIncompatible=true` les ajoute,
          avec `compatibility.status = incompatible` pour l'affichage du badge (RG21).
        - L'app affiche en permanence l'avertissement de RG51 ; les badges sont indicatifs.
      x-role: user
      parameters:
        - name: search
          in: query
          description: Texte recherché, 2 caractères au moins.
          schema: { type: string, minLength: 2, maxLength: 100 }
          example: poulet
        - name: includeIncompatible
          in: query
          schema: { type: boolean, default: false }
        - name: foodGroupID
          in: query
          schema: { $ref: '#/components/schemas/Uuid' }
        - name: onlyCustom
          in: query
          description: Seulement les aliments personnalisés de l'utilisateur.
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Lang'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Per'
      responses:
        '200':
          description: Page de résultats.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodSummaryPage' }
              example:
                items:
                  - id: 1574251b-58e4-5550-8303-43da54e6be07
                    nameFr: Poulet, viande et peau rôties/cuites au four
                    nameEn: Chicken, meat and skin, roasted/baked
                    kcal100g: 204
                    protein100g: 28.9
                    carbs100g: 0
                    fat100g: 9.88
                    foodGroupID: 9a39fb58-750f-59af-99e1-b84de0262213
                    isCustom: false
                    isArchived: false
                    compatibility:
                      status: compatible
                      conflicts: []
                      notices: [certification_unknown]
                metadata: { page: 1, per: 10, total: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Aliments]
      operationId: createCustomFood
      summary: Créer un aliment personnalisé
      description: |
        UC13, US12, RG18, RG19, RG20, RG21. L'aliment n'est visible que par son créateur.
        - Valeurs pour 100 g contrôlées par RG18 : énergie de 0 à 900 kcal, macros de 0 à 100 g et somme
          d'au plus 100 g, énergie déclarée proche de 4 P + 4 G + 9 L + 2 fibres + 7 alcool
          (écart d'au plus 20 kcal ou 20 %).
        - Étiquettes cohérentes (RG21) : porc implique viande, viande implique produit animal,
          alcool d'au moins 0,5 g pour 100 g implique `containsAlcohol`.
        - `labelsVerified = false` (par défaut) : l'aliment est marqué « allergènes non renseignés »
          et n'est jamais compté comme compatible.
        - Les unités facultatives sont créées avec l'aliment ; `labelEn` vide reprend `labelFr` (RG49).
        - La catégorie est facultative (« non classé » dans les statistiques).
      x-role: user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomFoodRequest' }
            example:
              nameFr: Galette de sarrasin maison
              nameEn: null
              kcal100g: 180
              protein100g: 6.5
              carbs100g: 33
              fat100g: 2.2
              fiber100g: 3.1
              alcohol100g: null
              foodGroupID: 2ee768c1-2b62-5634-b241-b5265b09618f
              containsMeat: false
              containsPork: false
              containsAnimalProduct: true
              containsAlcohol: false
              labelsVerified: true
              allergenIDs: [6f533ee4-c33e-5487-b5ca-84b3070fc3e6, cb621252-5425-5d66-9ea3-377eeff54ece]
              portions:
                - labelFr: 1 galette
                  labelEn: null
                  grams: 60
      responses:
        '201':
          description: Aliment créé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoodDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

