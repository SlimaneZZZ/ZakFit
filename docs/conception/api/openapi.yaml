      description: |
        UC13, RG18, RG19, RG21, RG25. Champs absents : inchangés ; `allergenIDs` remplace la liste.
        Les contrôles de RG18 et RG21 portent sur l'état final. Les lignes de repas déjà enregistrées gardent
