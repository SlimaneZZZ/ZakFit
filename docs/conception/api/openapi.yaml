  # ---------------------------------------------------------------- Export

  /appios/export:
    get:
      tags: [Export]
      operationId: exportCsv
      summary: Exporter une période en CSV (bonus)
      description: |
        UC27, US25, RG31, RG33, RG38. Fichier CSV en UTF-8, séparateur virgule, point décimal, une ligne par élément et des
        colonnes nommées. `content` choisit les repas (une ligne par ligne de repas), les activités (une ligne
        par séance) ou les deux, distingués par la colonne `record_type`. Plage obligatoire, 366 jours au plus.
        Colonnes : `record_type, date, meal_type, food_name, quantity_g, portion_label, portion_count, kcal,
        protein_g, carbs_g, fat_g, activity_type, activity_category, performed_at, duration_min, kcal_status, source`.
        Les colonnes qui ne concernent pas la ligne sont vides. `date` est le jour local figé (`eaten_on` ou `performed_on`, RG38),
        les kcal non renseignées restent vides (RG31) et les séances ignorées ne sont pas exportées (RG33).
        L'export PDF est hors périmètre.
      x-role: user
      parameters:
        - $ref: '#/components/parameters/FromRequired'
        - $ref: '#/components/parameters/ToRequired'
        - name: content
          in: query
          required: true
          schema: { type: string, enum: [meals, activities, all] }
        - $ref: '#/components/parameters/Lang'
      responses:
        '200':
          description: Fichier CSV, avec `Content-Disposition` attachment (`zakfit-AAAA-MM-JJ-AAAA-MM-JJ.csv`).
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="zakfit-2026-11-23-2026-11-29.csv"
          content:
            text/csv:
              schema: { type: string }
              example: |
                record_type,date,meal_type,food_name,quantity_g,portion_label,portion_count,kcal,protein_g,carbs_g,fat_g,activity_type,activity_category,performed_at,duration_min,kcal_status,source
                meal_item,2026-11-27,breakfast,Oeuf cru,100.00,1 œuf moyen (calibre US « large »),2.00,140.00,12.80,0.06,9.83,,,,,,
                activity,2026-11-27,,,,,,290.50,,,,Course modérée (~10 km/h),Cardio,2026-11-27T06:30:00Z,30,estimated,manual
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Back-office : utilisateurs

  /backoffice/users:
    get:
      tags: [Back-office utilisateurs]
      operationId: indexUsers
      summary: Lister, rechercher et filtrer les utilisateurs
      description: |
        UC31, US31, RG44, RG45, RG53. Liste paginée. Chaque ligne affiche le nom, l'email, le statut, la date
        d'inscription, le nombre d'activités et les objectifs définis : le mode de l'objectif calorique
        (`computed` ou `manual`, sans la valeur) et les objectifs d'activité en cours.
        **Aucune donnée de santé individuelle** (poids, allergènes, régimes, orientation, valeur calculée) ne sort (RG45).
        - Filtres : `status`, `role`, `search` (nom, prénom ou email), `registeredFrom` et `registeredTo`
          (jours UTC sur `created_at`), `minActivities` et `maxActivities` (séances non ignorées),
          `goalReached` (au moins un objectif d'activité atteint sur la dernière semaine ISO complète).
        - Tris : `createdAt` (par défaut), `lastName`, `email`, `status`, `activitiesCount`, `lastLoginAt` ;
          ordre `desc` par défaut.
        - `loginsLast30Days` vient de `login_event` (RG53).
      x-role: admin
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UserStatus' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - name: search
          in: query
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: registeredFrom
          in: query
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: registeredTo
          in: query
          schema: { $ref: '#/components/schemas/LocalDate' }
        - name: minActivities
          in: query
          schema: { type: integer, minimum: 0 }
        - name: maxActivities
          in: query
          schema: { type: integer, minimum: 0 }
        - name: goalReached
          in: query
          schema: { type: boolean }
        - name: sort
          in: query
          schema: { type: string, enum: [createdAt, lastName, email, status, activitiesCount, lastLoginAt], default: createdAt }
        - $ref: '#/components/parameters/Order'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Per'
      responses:
        '200':
          description: Page d'utilisateurs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserPage' }
              example:
                items:
                  - id: 3f2b8c1e-7a4d-4e9b-9c21-5d6e8f0a1b2c
                    lastName: LeBoss
                    firstName: Zak
                    email: zak.leboss@example.com
                    role: user
                    status: active
                    blockedUntil: null
                    createdAt: '2026-10-16T08:00:00Z'
                    activitiesCount: 31
                    calorieGoalMode: computed
                    activityGoals:
                      - metric: minutes
                        period: week
                        activityCategoryID: 7317bfcb-58f7-5ef7-b745-501168b0fe66
                        activityCategoryCode: cardio
                        targetValue: 150
                    lastLoginAt: '2026-11-27T09:15:00Z'
                    loginsLast30Days: 24
                metadata: { page: 1, per: 10, total: 1 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /backoffice/users/{userID}:
    parameters:
      - $ref: '#/components/parameters/UserID'
    get:
      tags: [Back-office utilisateurs]
      operationId: showUser
      summary: Lire la fiche d'un utilisateur
      description: |
        UC31, RG45. Mêmes champs que la liste, plus des compteurs d'usage (repas, favoris, aliments personnalisés).
        Aucune donnée de santé individuelle.
      x-role: admin
      responses:
        '200':
          description: Utilisateur.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Back-office utilisateurs]
      operationId: deleteUser
      summary: Supprimer un utilisateur
      description: |
        UC33, US31, RG07, RG43, RG48. Même service que la suppression par l'utilisateur (RG43), sans mot de passe.
        Journalisé (`delete_user`, sans nom ni email). L'administrateur ne peut pas se supprimer lui-même, et le
        compte d'un administrateur qui a des actions journalisées ne se supprime pas (on le suspend) : 409.
      x-role: admin
      responses:
        '204': { description: "Utilisateur et données supprimés." }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /backoffice/users/{userID}/status:
    parameters:
      - $ref: '#/components/parameters/UserID'
    patch:
      tags: [Back-office utilisateurs]
      operationId: updateUserStatus
      summary: Bloquer, suspendre ou réactiver un utilisateur
      description: |
        UC32, US31, RG06, RG07, RG48.
        - `blocked` : blocage temporaire, avec `blockedUntil` facultatif (instant futur) ; sans date, il dure
          jusqu'à la réactivation. Il se lève tout seul à la première requête qui suit cette date.
        - `suspended` : sans date de fin. `active` : réactivation.
        - `blockedUntil` est refusé pour un autre statut que `blocked` (400).
        - L'accès est coupé dès la requête suivante (403) ; les données sont conservées.
        - Un administrateur ne change pas son propre statut, et un statut identique est refusé : 409.
        - Journalisé (`block`, `suspend` ou `reactivate`).
      x-role: admin
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserStatusRequest' }
            examples:
              bloquer:
                summary: Bloquer jusqu'au 15 décembre
                value: { status: blocked, blockedUntil: '2026-12-15T00:00:00Z' }
              suspendre:
                summary: Suspendre
                value: { status: suspended }
              reactiver:
                summary: Réactiver
                value: { status: active }
      responses:
        '200':
          description: Statut changé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

